# Production defaults for YouTube's current challenge flow.
# The bgutil HTTP provider is started inside the same container on port 4416.
--extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
--extractor-args "youtube:player_client=mweb"

# Keep the local yt-dlp-ejs package as the primary JS challenge implementation.
# Remote EJS can be enabled explicitly later if a release-specific regression requires it.
