name: Publish Local Engine 0.8.0 Temporary

on:
  push:
    branches:
      - fix/collection-download-policy
    paths:
      - '.github/workflows/publish-local-engine-0.8.0-temp.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: local-engine-v0.8.0
      VALIDATED_HEAD: 2261c952320d5151a583c472ddf4ac1dd54c6e9e
      SOURCE_RUN_ID: '33473681567'
      EXPECTED_SHA256: f223c86953d845d7da857f593743532f6b220b22701caec3293d9116b4780389
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated 0.8.0 artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < local-engine/VERSION)" = "0.8.0"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish."
            exit 0
          fi
          mkdir -p release-artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name GalaxyLocalEngine-Windows --dir release-artifact
          test -f release-artifact/GalaxyLocalEngine-Windows.zip
          package_version="$(unzip -p release-artifact/GalaxyLocalEngine-Windows.zip VERSION | tr -d '\r\n')"
          test "$package_version" = "0.8.0"
          actual_sha="$(sha256sum release-artifact/GalaxyLocalEngine-Windows.zip | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"
          printf '%s  GalaxyLocalEngine-Windows.zip\n' "$actual_sha" > release-artifact/SHA256SUMS.txt

      - name: Publish validated GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi
          git fetch origin "$VALIDATED_HEAD"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$VALIDATED_HEAD"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          cat > release-notes.md <<'EOF'
          ## Galaxy Local Engine 0.8.0

          Windows 便携式本地 yt-dlp + FFmpeg 下载引擎。

          ### 主要更新
          - 新增有界 FIFO 媒体下载队列，当前任务运行时可以继续提交后续下载。
          - 网页可查看等待队列，并按单个任务取消等待项；状态仅暴露安全摘要，不暴露完整源 URL。
          - 新增可选“跳过已下载内容”，使用本机 `state/download-archive.txt`，默认关闭。
          - Local Bridge 使用稳定 HTTP 状态码和错误 code 区分参数错误、队列满、关闭中和线程交接超时。
          - 图片下载增加原图优先、WebP/AVIF 本机转换、重试、取消、`.part` 清理、磁盘空间保护与本地 ZIP。
          - 关闭程序时安全取消媒体/图片任务并清空等待队列，减少残留 yt-dlp/FFmpeg 进程和半成品文件。
          - 网页下载固定到准确的 `local-engine-v0.8.0` Release，不再依赖 `releases/latest`。

          ### 安装
          1. 下载 `GalaxyLocalEngine-Windows.zip`。
          2. 完整解压，不要直接在压缩包内运行。
          3. 双击 `install.cmd`。
          4. 保持 Galaxy Local Engine 运行，然后回到 SparkDownloader。

          本 Release 使用已通过完整 Windows #291 与产品门禁的构建成品，发布标签固定指向验证源码 `2261c952320d5151a583c472ddf4ac1dd54c6e9e`。
          EOF
          gh release create "$RELEASE_TAG" \
            release-artifact/GalaxyLocalEngine-Windows.zip \
            release-artifact/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Galaxy Local Engine local-engine-v0.8.0" \
            --notes-file release-notes.md \
            --verify-tag
