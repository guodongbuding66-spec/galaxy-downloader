name: Headless Web Dashboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_web_dashboard.py'
      - 'local-engine/test_headless_web_dashboard.py'
      - 'local-engine/test_headless_learning_navigation_ui.py'
      - 'local-engine/test_headless_learning_provider_ui.py'
      - 'local-engine/test_headless_learning_player_ui.py'
      - 'local-engine/test_headless_learning_progress_ui.py'
      - 'local-engine/web-dashboard/**'
      - '.github/workflows/headless-web-dashboard.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_web_dashboard.py'
      - 'local-engine/test_headless_web_dashboard.py'
      - 'local-engine/test_headless_learning_navigation_ui.py'
      - 'local-engine/test_headless_learning_provider_ui.py'
      - 'local-engine/test_headless_learning_player_ui.py'
      - 'local-engine/test_headless_learning_progress_ui.py'
      - 'local-engine/web-dashboard/**'
      - '.github/workflows/headless-web-dashboard.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile Dashboard HTTP contract
        run: python -m py_compile local-engine/headless_web_dashboard.py local-engine/test_headless_web_dashboard.py local-engine/test_headless_learning_navigation_ui.py local-engine/test_headless_learning_provider_ui.py local-engine/test_headless_learning_player_ui.py local-engine/test_headless_learning_progress_ui.py

      - name: Validate Dashboard JavaScript syntax
        run: |
          node --check local-engine/web-dashboard/app.js
          node --check local-engine/web-dashboard/ai-subscriptions.js
          node --check local-engine/web-dashboard/plugins.js
          node --check local-engine/web-dashboard/settings.js
          node --check local-engine/web-dashboard/learning.js
          node --check local-engine/web-dashboard/learning-attachments.js
          node --check local-engine/web-dashboard/learning-navigation.js
          node --check local-engine/web-dashboard/learning-player.js

      - name: Run Dashboard static HTTP contract
        run: |
          python local-engine/test_headless_web_dashboard.py
          python local-engine/test_headless_learning_navigation_ui.py
          python local-engine/test_headless_learning_provider_ui.py
          python local-engine/test_headless_learning_player_ui.py
          python local-engine/test_headless_learning_progress_ui.py
