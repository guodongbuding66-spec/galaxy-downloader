name: Download Profile Policy Bootstrap

on:
  push:
    branches:
      - phase5-profile-job-defaults

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[profile-policy-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase5-profile-job-defaults

      - name: Install Profile job-default policy in production entrypoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('local-engine/entrypoint.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'from document_policy import (\n',
                  'from download_profile_policy import install_download_profile_policy, run_download_profile_policy_self_test\nfrom document_policy import (\n',
              ),
              (
                  'install_workspace_policy(engine)\ninstall_recovery_policy(engine)\n',
                  'install_workspace_policy(engine)\ninstall_download_profile_policy(engine)\ninstall_recovery_policy(engine)\n',
              ),
              (
                  '    assert getattr(engine, "_galaxy_workspace_policy_installed", False) is True\n',
                  '    assert getattr(engine, "_galaxy_workspace_policy_installed", False) is True\n'
                  '    assert getattr(engine, "_galaxy_download_profile_policy_installed", False) is True\n'
                  '    assert getattr(engine.EngineWindow, "_galaxy_download_profile_policy_installed", False) is True\n',
              ),
              (
                  '    run_workspace_self_test()\n    run_runtime_health_self_test()\n',
                  '    run_workspace_self_test()\n    run_download_profile_policy_self_test()\n    run_runtime_health_self_test()\n',
              ),
              (
                  '# installed after both so an explicit format_id still wins over generic media\n# preferences. Workspace owns persistent output/transport defaults; recovery then\n',
                  '# installed after both so an explicit format_id still wins over generic media\n# preferences. Workspace owns persistent output/transport defaults. Download\n# Profiles then supply per-URL/per-manual job defaults while preserving explicit\n# request fields; recovery then\n',
              ),
          )
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'entrypoint anchor not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit entrypoint integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-engine/entrypoint.py
          git commit -m "feat(profiles): install job-default policy [profile-policy-bootstrap]"
          git push origin HEAD:phase5-profile-job-defaults
