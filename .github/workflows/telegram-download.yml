name: Telegram Download

on:
  pull_request:
    paths:
      - "local-engine/telegram_download.py"
      - "local-engine/telegram_transfer.py"
      - "scripts/test-local-telegram-download.py"
      - ".github/workflows/telegram-download.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Local Engine dependencies
        run: python -m pip install -r local-engine/requirements.txt
      - name: Compile Telegram download path
        run: >-
          python -m py_compile
          local-engine/telegram_download.py
          local-engine/telegram_transfer.py
          scripts/test-local-telegram-download.py
      - name: Test Telegram download contract
        run: python scripts/test-local-telegram-download.py
