name: Local Engine Linux Tray

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/desktop_tray.py'
      - 'local-engine/requirements.txt'
      - 'scripts/test-local-linux-tray.py'
      - '.github/workflows/local-engine-linux-tray.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/desktop_tray.py'
      - 'local-engine/requirements.txt'
      - 'scripts/test-local-linux-tray.py'
      - '.github/workflows/local-engine-linux-tray.yml'

permissions:
  contents: read

jobs:
  linux-tray:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 AppIndicator
            runner: ubuntu-24.04
          - label: Linux arm64 AppIndicator
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native AppIndicator test runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1 \
            dbus-x11 \
            xvfb \
            xauth
          /usr/bin/python3 -m venv --system-site-packages .venv-linux-tray
          .venv-linux-tray/bin/python -m pip install -r local-engine/requirements.txt

      - name: Validate Linux tray dependencies
        run: |
          set -euo pipefail
          .venv-linux-tray/bin/python -m py_compile local-engine/desktop_tray.py scripts/test-local-linux-tray.py
          .venv-linux-tray/bin/python - <<'PY'
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('AyatanaAppIndicator3', '0.1')
          from gi.repository import AyatanaAppIndicator3, Gtk
          assert Gtk is not None
          assert AyatanaAppIndicator3 is not None
          print('GI Ayatana AppIndicator dependencies OK')
          PY

      - name: Exercise AppIndicator lifecycle beside Tk-compatible X11 session
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: >-
          timeout 30s
          dbus-run-session --
          xvfb-run -a
          .venv-linux-tray/bin/python
          scripts/test-local-linux-tray.py
