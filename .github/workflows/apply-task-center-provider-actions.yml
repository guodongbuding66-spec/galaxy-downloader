name: Apply Task Center Provider Actions

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-task-center-provider-actions.py
      - .github/workflows/apply-task-center-provider-actions.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact provider action patch
        run: python scripts/apply-task-center-provider-actions.py
      - name: Compile patched task surfaces
        run: >-
          python -m py_compile
          local-engine/task_center.py
          local-engine/local_task_provider.py
          local-engine/aria2_task_provider.py
      - name: Run provider and task-center self-tests
        shell: bash
        run: |
          PYTHONPATH=local-engine python - <<'PY'
          from aria2_task_provider import run_aria2_task_provider_self_test
          from local_task_provider import run_local_task_provider_self_test
          from task_center import run_task_center_self_test
          run_local_task_provider_self_test()
          run_aria2_task_provider_self_test()
          run_task_center_self_test()
          print('provider/task-center self-tests: OK')
          PY
      - name: Verify diff
        run: git diff --check -- local-engine/task_center.py
      - name: Commit task-center routing
        run: |
          if git diff --quiet -- local-engine/task_center.py; then
            echo 'No task-center changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/task_center.py
          git commit -m 'feat(tasks): route provider pause resume controls'
          git push origin HEAD:main
