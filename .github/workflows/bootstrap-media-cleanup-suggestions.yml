name: Bootstrap Media Cleanup Suggestions

on:
  push:
    branches:
      - feature/media-cleanup-suggestions
    paths:
      - 'scripts/test-local-media-cleanup-suggestions.py'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/media-cleanup-suggestions

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile and run suggestion tests
        run: |
          python -m py_compile local-engine/media_cleanup.py local-engine/media_cleanup_suggestions.py scripts/test-local-media-cleanup-suggestions.py
          python scripts/test-local-media-cleanup-suggestions.py
