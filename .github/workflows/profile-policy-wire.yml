name: Profile Policy Wire

on:
  push:
    branches:
      - phase5-download-profile-application

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[profile-policy-wire]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: phase5-download-profile-application

      - name: Wire policy into production entrypoint
        shell: python
        run: |
          from pathlib import Path
          path = Path('local-engine/entrypoint.py')
          text = path.read_text(encoding='utf-8')
          changes = [
              (
                  'from exact_format_policy import install_exact_format_policy, run_exact_format_policy_self_test\n',
                  'from exact_format_policy import install_exact_format_policy, run_exact_format_policy_self_test\nfrom download_profile_policy import install_download_profile_policy, run_download_profile_policy_self_test\n',
              ),
              (
                  'install_workspace_policy(engine)\ninstall_recovery_policy(engine)\n',
                  'install_workspace_policy(engine)\ninstall_download_profile_policy(engine)\ninstall_recovery_policy(engine)\n',
              ),
              (
                  '    assert getattr(engine, "_galaxy_workspace_policy_installed", False) is True\n',
                  '    assert getattr(engine, "_galaxy_workspace_policy_installed", False) is True\n    assert getattr(engine, "_galaxy_download_profile_policy_installed", False) is True\n',
              ),
              (
                  '    run_workspace_self_test()\n',
                  '    run_workspace_self_test()\n    run_download_profile_policy_self_test()\n',
              ),
          ]
          for old, new in changes:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'wire anchor not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Compile wired modules
        run: python -m py_compile local-engine/download_profile_policy.py local-engine/entrypoint.py

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-engine/entrypoint.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(profiles): wire application policy into engine [profile-policy-wire]"
          git push origin HEAD:phase5-download-profile-application
