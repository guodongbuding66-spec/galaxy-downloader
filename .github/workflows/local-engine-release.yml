name: Local Engine Release

on:
  push:
    branches:
      - main
    paths:
      - 'local-engine/VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release state
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'local-engine/VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "local-engine/VERSION must use x.y.z format; got '$version'"
          }

          $tag = "local-engine-v$version"
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          $exists = $releaseTags -contains $tag

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exists=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($exists) {
            Write-Host "Release $tag already exists; build and publish steps will be skipped."
          } else {
            Write-Host "Preparing release $tag"
          }

      - uses: actions/setup-python@v5
        if: steps.release.outputs.exists != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        if: steps.release.outputs.exists != 'true'
        run: python -m pip install -r local-engine/requirements.txt

      - name: Validate source and version
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m py_compile local-engine/engine.py
          python local-engine/engine.py --self-test
          $engineVersion = (python local-engine/engine.py --version | Select-Object -Last 1).Trim()
          $releaseVersion = '${{ steps.release.outputs.version }}'
          if ($engineVersion -ne $releaseVersion) {
            throw "engine.py VERSION ($engineVersion) does not match local-engine/VERSION ($releaseVersion)"
          }

      - name: Build portable executable
        if: steps.release.outputs.exists != 'true'
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --add-data "local-engine/VERSION;."
          local-engine/engine.py

      - name: Validate packaged executable
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/GalaxyLocalEngine.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GalaxyLocalEngine.exe self-test exited with $($process.ExitCode)"
          }

      - name: Assemble release package
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/GalaxyLocalEngine.exe dist/package/GalaxyLocalEngine.exe
          Copy-Item local-engine/install.ps1 dist/package/install.ps1
          Copy-Item local-engine/uninstall.ps1 dist/package/uninstall.ps1
          Copy-Item local-engine/README.md dist/package/README.md
          Copy-Item local-engine/VERSION dist/package/VERSION
          Compress-Archive -Force -Path dist/package/* -DestinationPath dist/GalaxyLocalEngine-Windows.zip
          Get-FileHash dist/GalaxyLocalEngine-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  GalaxyLocalEngine-Windows.zip" } | Set-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not $remoteTag) {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin $env:RELEASE_TAG
          }

          $notes = @"
          ## Galaxy Local Engine $env:RELEASE_TAG

          Free Windows local yt-dlp + FFmpeg fallback for Galaxy Downloader.

          1. Download `GalaxyLocalEngine-Windows.zip`.
          2. Extract it.
          3. Run `install.ps1` once.
          4. Return to Galaxy Downloader and use **Local yt-dlp download**.

          Media, browser cookies and FFmpeg processing stay on the user's computer.
          "@

          gh release create $env:RELEASE_TAG dist/GalaxyLocalEngine-Windows.zip dist/SHA256SUMS.txt --title "Galaxy Local Engine $env:RELEASE_TAG" --notes $notes --verify-tag
