name: Local Engine Release

on:
  push:
    branches:
      - main
    paths:
      - 'local-engine/VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve version and release state
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'local-engine/VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "local-engine/VERSION must use x.y.z format; got '$version'"
          }

          $tag = "local-engine-v$version"
          $releaseTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          $exists = $releaseTags -contains $tag

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exists=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($exists) {
            Write-Host "Release $tag already exists; build and publish steps will be skipped."
          } else {
            Write-Host "Preparing release $tag"
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.release.outputs.exists != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r local-engine/requirements.txt
          python -m pip install "pillow>=11,<12"

      - name: Generate branded Windows icon
        if: steps.release.outputs.exists != 'true'
        run: python local-engine/generate_icon.py --output local-engine/GalaxyLocalEngine.ico

      - name: Validate source and version
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          python -m py_compile `
            local-engine/entrypoint.py `
            local-engine/engine.py `
            local-engine/bridge.py `
            local-engine/bridge_submission_policy.py `
            local-engine/archive_policy.py `
            local-engine/media_policy.py `
            local-engine/workspace_policy.py `
            local-engine/recovery_policy.py `
            local-engine/pause_resume_policy.py `
            local-engine/resume_bridge.py `
            local-engine/recovery_display.py `
            local-engine/failure_policy.py `
            local-engine/runtime_health.py `
            local-engine/job_queue.py `
            local-engine/queue_controls.py `
            local-engine/job_history.py `
            local-engine/desktop_ui.py `
            local-engine/desktop_extras.py `
            local-engine/desktop_manager.py `
            local-engine/desktop_runtime.py `
            local-engine/task_center.py `
            local-engine/update_check.py `
            local-engine/browser_auth.py `
            local-engine/image_archive_policy.py `
            local-engine/image_bridge.py `
            local-engine/image_download.py `
            local-engine/web_document.py `
            local-engine/document_policy.py `
            local-engine/document_markdown.py `
            local-engine/dynamic_document.py `
            local-engine/url_policy.py `
            local-engine/external_ytdlp.py `
            local-engine/wechat_channels.py

          python local-engine/entrypoint.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Source self-test exited with $LASTEXITCODE" }

          python local-engine/entrypoint.py --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Source UI smoke exited with $LASTEXITCODE" }

          python scripts/test-local-engine-policy.py
          python scripts/test-local-url-policy.py
          python scripts/test-local-document-policy.py
          python scripts/test-local-entrypoint-policy.py
          python scripts/test-local-browser-auth.py
          python scripts/test-local-image-download.py
          python scripts/test-local-image-bridge.py
          python scripts/test-local-job-queue.py
          python scripts/test-local-bridge-submission.py
          python scripts/test-local-archive-policy.py
          python scripts/test-local-media-policy.py
          python scripts/test-local-image-archive-policy.py
          python scripts/test-local-manager-policy.py
          python scripts/test-local-runtime-policy.py
          python scripts/test-local-recovery-policy.py
          python scripts/test-local-pause-resume.py
          python scripts/test-local-release-notes.py
          python scripts/test-dynamic-document.py

          $versionOutput = python local-engine/entrypoint.py --version
          if ($LASTEXITCODE -ne 0) { throw "Source --version exited with $LASTEXITCODE" }
          $engineVersion = ($versionOutput | Select-Object -Last 1).Trim()
          $releaseVersion = '${{ steps.release.outputs.version }}'
          if ($engineVersion -ne $releaseVersion) {
            throw "engine VERSION ($engineVersion) does not match local-engine/VERSION ($releaseVersion)"
          }

      - name: Build portable executable
        if: steps.release.outputs.exists != 'true'
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GalaxyLocalEngine
          --icon "local-engine/GalaxyLocalEngine.ico"
          --collect-all yt_dlp
          --add-data "local-engine/VERSION;."
          local-engine/entrypoint.py

      - name: Validate packaged executable self-test
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/GalaxyLocalEngine.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GalaxyLocalEngine.exe self-test exited with $($process.ExitCode)"
          }

      - name: Validate packaged desktop UI construction
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/GalaxyLocalEngine.exe' -ArgumentList '--ui-smoke-test' -PassThru
          $finished = $process.WaitForExit(20000)
          if (-not $finished) {
            Get-Process -Name 'GalaxyLocalEngine' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'GalaxyLocalEngine.exe UI smoke did not exit within 20 seconds. Release blocked because an exception dialog or startup deadlock may be present.'
          }
          if ($process.ExitCode -ne 0) {
            throw "GalaxyLocalEngine.exe UI smoke exited with $($process.ExitCode)"
          }
          Write-Host 'Packaged desktop UI constructed and closed cleanly.'

      - name: Assemble release package
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/GalaxyLocalEngine.exe dist/package/GalaxyLocalEngine.exe
          Copy-Item local-engine/install.cmd dist/package/install.cmd
          Copy-Item local-engine/install.ps1 dist/package/install.ps1
          Copy-Item local-engine/uninstall.cmd dist/package/uninstall.cmd
          Copy-Item local-engine/uninstall.ps1 dist/package/uninstall.ps1
          Copy-Item local-engine/README.md dist/package/README.md
          Copy-Item 'local-engine/使用说明.txt' 'dist/package/使用说明.txt'
          Copy-Item local-engine/VERSION dist/package/VERSION

      - name: Add verified offline FFmpeg and yt-dlp
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: ./local-engine/prepare-bundle.ps1 -PackageDir dist/package

      - name: Validate release package contents
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $required = @(
            'GalaxyLocalEngine.exe',
            'yt-dlp.exe',
            'ffmpeg\bin\ffmpeg.exe',
            'ffmpeg\bin\ffprobe.exe',
            'install.cmd',
            'install.ps1',
            'uninstall.cmd',
            'uninstall.ps1',
            'README.md',
            '使用说明.txt',
            'VERSION'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path 'dist/package' $file))) {
              throw "Release package is missing $file"
            }
          }

      - name: Validate installer and protocol lifecycle
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $testInstall = Join-Path $env:RUNNER_TEMP 'GalaxyLocalEngineReleaseTest'
          & 'dist/package/install.ps1' -InstallDir $testInstall -NoLaunch

          $protocolCommandPath = 'HKCU:\Software\Classes\galaxy-downloader\shell\open\command'
          if (-not (Test-Path $protocolCommandPath)) {
            throw 'galaxy-downloader protocol registration was not created'
          }
          $registeredCommand = (Get-Item $protocolCommandPath).GetValue('')
          $expectedExe = Join-Path $testInstall 'GalaxyLocalEngine.exe'
          if ($registeredCommand -notlike "*$expectedExe*") {
            throw "Protocol command does not target the installed executable: $registeredCommand"
          }

          foreach ($file in @('yt-dlp.exe', 'ffmpeg\bin\ffmpeg.exe', 'ffmpeg\bin\ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $testInstall $file))) {
              throw "Portable installer did not preserve bundled dependency: $file"
            }
          }
          if (-not (Test-Path (Join-Path $testInstall 'downloads'))) {
            throw 'Portable installer did not create the local downloads folder'
          }

          $externalYtDlp = Join-Path $testInstall 'yt-dlp.exe'
          $externalVersion = (& $externalYtDlp --version | Select-Object -Last 1).Trim()
          if (-not $externalVersion) {
            throw 'Bundled yt-dlp.exe did not report a version'
          }
          Write-Host "Bundled yt-dlp version: $externalVersion"

          & 'dist/package/uninstall.ps1' -InstallDir $testInstall
          if (Test-Path 'HKCU:\Software\Classes\galaxy-downloader') {
            throw 'galaxy-downloader protocol registration remained after uninstall'
          }
          Remove-Item -Recurse -Force $testInstall -ErrorAction SilentlyContinue

      - name: Compress release and write SHA-256
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Force -Path dist/package/* -DestinationPath dist/GalaxyLocalEngine-Windows.zip
          Get-FileHash dist/GalaxyLocalEngine-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  GalaxyLocalEngine-Windows.zip" } | Set-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if (-not $remoteTag) {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin $env:RELEASE_TAG
          }

          python scripts/test-local-release-notes.py
          if ($LASTEXITCODE -ne 0) { throw "Release notes contract failed" }

          gh release create $env:RELEASE_TAG dist/GalaxyLocalEngine-Windows.zip dist/SHA256SUMS.txt --title "Galaxy Local Engine $env:RELEASE_TAG" --notes-file local-engine/RELEASE_NOTES.md --verify-tag
