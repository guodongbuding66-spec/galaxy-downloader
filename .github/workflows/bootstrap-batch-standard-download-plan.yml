name: Bootstrap Batch Standard Download Plan

on:
  push:
    branches:
      - feature/batch-standard-download-plan
    paths:
      - '.github/workflows/bootstrap-batch-standard-download-plan.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/batch-standard-download-plan

      - name: Apply Batch standard plan wiring
        run: python scripts/integrate-batch-standard-download-plan.py

      - name: Verify product anchors
        run: |
          grep -F '<BatchDownloadPlanControls' src/components/downloader/BatchWorkbench.tsx
          grep -F 'options: buildLocalEngineBatchOptions(' src/components/downloader/BatchWorkbench.tsx
          grep -F 'skipPreviouslyDownloaded: false' src/lib/local-engine-batch-options.ts

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.8.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted Batch option tests
        run: >-
          pnpm exec vitest run
          tests/local-engine-batch-standard-options.test.ts
          tests/local-engine-batch-advanced-options.test.ts
          tests/local-engine-batch-bridge-client.test.ts
          tests/batch-workbench-feedback.test.ts

      - name: Run lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

      - name: Commit permanent product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/downloader/BatchWorkbench.tsx
          git commit -m 'feat(web): add standard download plan to Batch Workbench'
          git push origin HEAD:feature/batch-standard-download-plan
