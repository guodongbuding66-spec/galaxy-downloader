name: Bootstrap Pause Resume Core

on:
  push:
    branches:
      - feat/local-engine-0.15-pause-resume
    paths:
      - '.github/workflows/bootstrap-pause-resume-core.yml'

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/local-engine-0.15-pause-resume

      - name: Compile pause resume modules
        run: python -m py_compile local-engine/pause_resume_policy.py local-engine/resume_bridge.py scripts/test-local-pause-resume.py

      - name: Run pause resume lifecycle tests
        run: python scripts/test-local-pause-resume.py

      - name: Validate external continuation contract
        run: python scripts/test-local-engine-policy.py
