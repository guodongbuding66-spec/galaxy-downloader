name: Bootstrap Pause Resume Core

on:
  push:
    branches:
      - feat/local-engine-0.15-pause-resume
    paths:
      - '.github/workflows/bootstrap-pause-resume-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/local-engine-0.15-pause-resume

      - name: Apply deterministic code transforms
        run: python scripts/bootstrap_pause_resume_task_center.py

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            local-engine/entrypoint.py \
            local-engine/resume_bridge.py \
            local-engine/task_center.py \
            local-engine/pause_resume_policy.py

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/entrypoint.py local-engine/task_center.py
          git commit -m 'feat(local-engine): expose resumable tasks in task center'
          git push origin HEAD:feat/local-engine-0.15-pause-resume
