name: Bootstrap Pause Resume Core

on:
  push:
    branches:
      - feat/local-engine-0.15-pause-resume
    paths:
      - '.github/workflows/bootstrap-pause-resume-core.yml'

permissions:
  contents: write

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/local-engine-0.15-pause-resume

      - name: Apply packaged self-test transform
        run: python scripts/bootstrap_pause_resume_selftest.py

      - name: Compile pause resume policy
        run: python -m py_compile local-engine/pause_resume_policy.py

      - name: Run embedded pause resume self-test
        shell: python
        run: |
          import importlib.util
          import sys
          from pathlib import Path
          path = Path('local-engine/pause_resume_policy.py')
          spec = importlib.util.spec_from_file_location('pause_resume_selftest', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['pause_resume_selftest'] = module
          spec.loader.exec_module(module)
          module.run_pause_resume_self_test()

      - name: Run standalone lifecycle test
        run: python scripts/test-local-pause-resume.py

      - name: Commit packaged self-test
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/pause_resume_policy.py
          git commit -m 'test(local-engine): gate packaged pause resume lifecycle'
          git push origin HEAD:feat/local-engine-0.15-pause-resume
