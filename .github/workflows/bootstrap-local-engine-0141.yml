name: Bootstrap Local Engine 0.14.1 Hotfix

on:
  push:
    branches:
      - fix/local-engine-0.14.1-desktop-startup
    paths:
      - '.github/workflows/bootstrap-local-engine-0141.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/local-engine-0.14.1-desktop-startup

      - name: Apply minimal 0.14.1 startup hotfix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected snippet not found in {path}: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one snippet in {path}; got {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Actual packaged-0.14.0 crash: Tcl splits `Segoe UI 9` into a
          # family + invalid `UI` size token. Keep the font family one Tcl item.
          replace_once(
              'local-engine/desktop_ui.py',
              '        window.option_add("*Font", "Segoe UI 9")\n',
              '        # Tcl parses string font descriptors as lists; quote multi-word families.\n'
              '        window.option_add("*Font", "{Segoe UI} 9")\n',
          )

          # 2) Add a deterministic UI construction mode. Self-test alone never
          # instantiates Tk and therefore missed the released startup crash.
          replace_once(
              'local-engine/entrypoint.py',
              '\n\ndef _cancel_image_worker_before_exit(timeout_seconds: float = 40.0) -> None:\n',
              '\n\ndef _run_ui_smoke_test() -> int:\n'
              '    """Construct the fully wrapped Tk desktop UI and close cleanly."""\n'
              '    app = engine.EngineWindow(None)\n'
              '    app.withdraw()\n'
              '    app.update_idletasks()\n'
              '    app.after(100, app.close_app)\n'
              '    app.mainloop()\n'
              '    return 0\n'
              '\n\ndef _cancel_image_worker_before_exit(timeout_seconds: float = 40.0) -> None:\n',
          )
          replace_once(
              'local-engine/entrypoint.py',
              '    if "--version" in sys.argv:\n        return engine.main()\n\n',
              '    if "--version" in sys.argv:\n        return engine.main()\n'
              '    if "--ui-smoke-test" in sys.argv:\n'
              '        return _run_ui_smoke_test()\n\n',
          )

          # 3) PR Windows CI: make Python failures fail closed and exercise both
          # source and packaged desktop UI construction.
          win = Path('.github/workflows/local-engine-windows.yml')
          text = win.read_text(encoding='utf-8')
          text = text.replace(
              '      - name: Validate source self-test and version\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          python local-engine/entrypoint.py --self-test\n'
              '          $expected = (Get-Content \'local-engine/VERSION\' -Raw).Trim()\n'
              '          $actual = (python local-engine/entrypoint.py --version | Select-Object -Last 1).Trim()\n',
              '      - name: Validate source self-test, UI construction, and version\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $ErrorActionPreference = \'Stop\'\n'
              '          $PSNativeCommandUseErrorActionPreference = $true\n'
              '          python local-engine/entrypoint.py --self-test\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source self-test exited with $LASTEXITCODE" }\n'
              '          python local-engine/entrypoint.py --ui-smoke-test\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source UI smoke exited with $LASTEXITCODE" }\n'
              '          $expected = (Get-Content \'local-engine/VERSION\' -Raw).Trim()\n'
              '          $versionOutput = python local-engine/entrypoint.py --version\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source --version exited with $LASTEXITCODE" }\n'
              '          $actual = ($versionOutput | Select-Object -Last 1).Trim()\n',
              1,
          )
          text = text.replace(
              '      - name: Validate Local Engine policies\n        run: |\n',
              '      - name: Validate Local Engine policies\n        shell: pwsh\n        run: |\n'
              '          $ErrorActionPreference = \'Stop\'\n'
              '          $PSNativeCommandUseErrorActionPreference = $true\n',
              1,
          )
          old_packaged = (
              '      - name: Validate packaged executable\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $process = Start-Process -FilePath \'dist/GalaxyLocalEngine.exe\' -ArgumentList \'--self-test\' -Wait -PassThru\n'
              '          if ($process.ExitCode -ne 0) {\n'
              '            throw "GalaxyLocalEngine.exe self-test exited with $($process.ExitCode)"\n'
              '          }\n\n'
          )
          new_packaged = old_packaged.replace('Validate packaged executable', 'Validate packaged executable self-test') + (
              '      - name: Validate packaged desktop UI construction\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $process = Start-Process -FilePath \'dist/GalaxyLocalEngine.exe\' -ArgumentList \'--ui-smoke-test\' -PassThru\n'
              '          $finished = $process.WaitForExit(20000)\n'
              '          if (-not $finished) {\n'
              '            Get-Process -Name \'GalaxyLocalEngine\' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n'
              '            throw \'GalaxyLocalEngine.exe UI smoke did not exit within 20 seconds.\'\n'
              '          }\n'
              '          if ($process.ExitCode -ne 0) {\n'
              '            throw "GalaxyLocalEngine.exe UI smoke exited with $($process.ExitCode)"\n'
              '          }\n\n'
          )
          if old_packaged not in text:
              raise SystemExit('packaged Windows validation block not found')
          text = text.replace(old_packaged, new_packaged, 1)
          win.write_text(text, encoding='utf-8')

          # 4) Release CI: same source/packaged UI gate. A release may not be
          # published when a windowed PyInstaller binary only shows an exception dialog.
          release = Path('.github/workflows/local-engine-release.yml')
          text = release.read_text(encoding='utf-8')
          text = text.replace(
              '      - name: Validate source and version\n'
              '        if: steps.release.outputs.exists != \'true\'\n'
              '        shell: pwsh\n'
              '        run: |\n',
              '      - name: Validate source and version\n'
              '        if: steps.release.outputs.exists != \'true\'\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $ErrorActionPreference = \'Stop\'\n'
              '          $PSNativeCommandUseErrorActionPreference = $true\n',
              1,
          )
          text = text.replace(
              '          python local-engine/entrypoint.py --self-test\n'
              '          python scripts/test-local-engine-policy.py\n',
              '          python local-engine/entrypoint.py --self-test\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source self-test exited with $LASTEXITCODE" }\n'
              '          python local-engine/entrypoint.py --ui-smoke-test\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source UI smoke exited with $LASTEXITCODE" }\n'
              '          python scripts/test-local-engine-policy.py\n',
              1,
          )
          text = text.replace(
              '          $engineVersion = (python local-engine/entrypoint.py --version | Select-Object -Last 1).Trim()\n',
              '          $versionOutput = python local-engine/entrypoint.py --version\n'
              '          if ($LASTEXITCODE -ne 0) { throw "Source --version exited with $LASTEXITCODE" }\n'
              '          $engineVersion = ($versionOutput | Select-Object -Last 1).Trim()\n',
              1,
          )
          old_release_packaged = (
              '      - name: Validate packaged executable\n'
              '        if: steps.release.outputs.exists != \'true\'\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $process = Start-Process -FilePath \'dist/GalaxyLocalEngine.exe\' -ArgumentList \'--self-test\' -Wait -PassThru\n'
              '          if ($process.ExitCode -ne 0) {\n'
              '            throw "GalaxyLocalEngine.exe self-test exited with $($process.ExitCode)"\n'
              '          }\n\n'
          )
          new_release_packaged = old_release_packaged.replace('Validate packaged executable', 'Validate packaged executable self-test') + (
              '      - name: Validate packaged desktop UI construction\n'
              '        if: steps.release.outputs.exists != \'true\'\n'
              '        shell: pwsh\n'
              '        run: |\n'
              '          $process = Start-Process -FilePath \'dist/GalaxyLocalEngine.exe\' -ArgumentList \'--ui-smoke-test\' -PassThru\n'
              '          $finished = $process.WaitForExit(20000)\n'
              '          if (-not $finished) {\n'
              '            Get-Process -Name \'GalaxyLocalEngine\' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n'
              '            throw \'GalaxyLocalEngine.exe UI smoke did not exit within 20 seconds.\'\n'
              '          }\n'
              '          if ($process.ExitCode -ne 0) {\n'
              '            throw "GalaxyLocalEngine.exe UI smoke exited with $($process.ExitCode)"\n'
              '          }\n\n'
          )
          if old_release_packaged not in text:
              raise SystemExit('packaged release validation block not found')
          text = text.replace(old_release_packaged, new_release_packaged, 1)
          release.write_text(text, encoding='utf-8')

          # 5) Ship as 0.14.1 and keep the website pinned to the exact matching tag.
          Path('local-engine/VERSION').write_text('0.14.1\n', encoding='utf-8')
          replace_once(
              'src/lib/local-engine.ts',
              "export const LOCAL_ENGINE_REQUIRED_VERSION = '0.14.0'",
              "export const LOCAL_ENGINE_REQUIRED_VERSION = '0.14.1'",
          )

      - name: Commit hotfix changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/desktop_ui.py local-engine/entrypoint.py local-engine/VERSION src/lib/local-engine.ts .github/workflows/local-engine-windows.yml .github/workflows/local-engine-release.yml
          git commit -m 'fix(local-engine): prevent packaged desktop startup crash'
          git push origin HEAD:fix/local-engine-0.14.1-desktop-startup
