name: Repair Hotfix Validation Runner

on:
  push:
    branches:
      - hotfix/local-engine-cookie-ui-regression
    paths:
      - '.github/workflows/fix-hotfix-runner.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix/local-engine-cookie-ui-regression
      - name: Repair validation environment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-local-engine-hotfix.yml')
          text = path.read_text(encoding='utf-8')
          old = """          python -m pip install --disable-pip-version-check 'yt-dlp[default]>=2026.8.0,<2027' 'websocket-client>=1.8,<2'\n          python local-engine/engine.py --self-test\n"""
          new = """          sudo apt-get update\n          sudo apt-get install -y python3-tk\n          python -m pip install --disable-pip-version-check 'yt-dlp[default]>=2026.8.0,<2027' 'websocket-client>=1.8,<2'\n          python local-engine/engine.py --self-test\n"""
          if old not in text:
              raise SystemExit('self-test block not found')
          text = text.replace(old, new, 1)
          old_web = """          pnpm install --frozen-lockfile\n          pnpm lint\n"""
          new_web = """          pnpm install --frozen-lockfile\n          pnpm lint\n          pnpm build\n"""
          if old_web not in text:
              raise SystemExit('web validation block not found')
          path.write_text(text.replace(old_web, new_web, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-hotfix-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: run desktop self-test with tkinter and production build'
          git push origin HEAD:hotfix/local-engine-cookie-ui-regression
