name: Desktop AI Tasks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/desktop_ai_tasks.py'
      - 'local-engine/entrypoint.py'
      - 'scripts/test-local-desktop-ai-tasks.py'
      - '.github/workflows/desktop-ai-tasks.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/desktop_ai_tasks.py'
      - 'local-engine/entrypoint.py'
      - 'scripts/test-local-desktop-ai-tasks.py'
      - '.github/workflows/desktop-ai-tasks.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Desktop AI Tasks contract
        run: python -m py_compile local-engine/desktop_ai_tasks.py local-engine/entrypoint.py scripts/test-local-desktop-ai-tasks.py

      - name: Run Desktop AI Tasks contract
        run: python scripts/test-local-desktop-ai-tasks.py
