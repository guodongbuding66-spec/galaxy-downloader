name: Qwen3 ASR Provider

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/qwen3_asr_provider.py'
      - 'local-engine/ai_workspace.py'
      - 'local-engine/media_library.py'
      - 'scripts/test-local-asr-qwen3.py'
      - '.github/workflows/asr-qwen3-provider.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/qwen3_asr_provider.py'
      - 'local-engine/ai_workspace.py'
      - 'local-engine/media_library.py'
      - 'scripts/test-local-asr-qwen3.py'
      - '.github/workflows/asr-qwen3-provider.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile provider contract
        run: python -m py_compile local-engine/qwen3_asr_provider.py scripts/test-local-asr-qwen3.py

      - name: Run Qwen3-ASR provider self-test
        run: python scripts/test-local-asr-qwen3.py
