name: Bootstrap Media Cleanup Core

on:
  push:
    branches:
      - feature/media-cleanup-core
    paths:
      - 'scripts/bootstrap-media-cleanup-core.py'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/media-cleanup-core

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply deterministic media cleanup transform
        run: python scripts/bootstrap-media-cleanup-core.py

      - name: Compile and run cleanup tests
        run: |
          python -m py_compile local-engine/media_cleanup.py local-engine/entrypoint.py scripts/test-local-media-cleanup.py
          python scripts/test-local-media-cleanup.py

      - name: Commit product files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/media_cleanup.py local-engine/entrypoint.py scripts/test-local-media-cleanup.py
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'feat(local-engine): harden visible overlay cleanup core'
          git push origin HEAD:feature/media-cleanup-core
