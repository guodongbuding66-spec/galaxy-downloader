name: Container Backend Deploy

on:
  workflow_run:
    workflows:
      - 'Container Backend CI'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-backend-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.CONTAINER_BACKEND_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTAINER_BACKEND_HEALTH_URL: ${{ vars.CONTAINER_BACKEND_HEALTH_URL }}

    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify production credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Container backend deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: container-backend
        run: npm install --no-audit --no-fund

      - name: Revalidate Worker configuration
        working-directory: container-backend
        run: |
          npm run cf-types
          npm run typecheck

      - name: Verify Docker engine
        run: docker info

      - name: Deploy Worker and Container rollout
        working-directory: container-backend
        run: npm run deploy

      - name: Verify deployed health endpoint
        if: ${{ env.CONTAINER_BACKEND_HEALTH_URL != '' }}
        shell: bash
        run: |
          health_url="${CONTAINER_BACKEND_HEALTH_URL%/}/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "$health_url" > /tmp/container-backend-health.json; then
              cat /tmp/container-backend-health.json
              exit 0
            fi
            echo "Health check attempt $attempt/30 has not succeeded yet."
            sleep 10
          done
          echo '::error::Container backend deployment completed, but the configured health endpoint did not become ready in time.'
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Container Backend Deploy'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Worker: `galaxy-downloader-backend`'
            if [[ -n "$CONTAINER_BACKEND_HEALTH_URL" ]]; then
              echo "- Health base: \`$CONTAINER_BACKEND_HEALTH_URL\`"
            else
              echo '- Health verification: skipped (set repository variable `CONTAINER_BACKEND_HEALTH_URL` to enable it)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
