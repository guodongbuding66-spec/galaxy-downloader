name: Apply V1.6 UI sync

on:
  push:
    branches:
      - ui/v1.6-modern-workbench
    paths:
      - .github/workflows/_apply-v16-sync.yml
      - tools/v16-sync.part.*

permissions:
  contents: write

concurrency:
  group: v16-ui-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack reviewed V1.6 source payload
        shell: bash
        run: |
          set -euo pipefail
          echo "b8b4538f99c083acb14f1903630e7130f8ad4d27752e4dfe76ba81a8acd77f0f  tools/v16-sync.part.00" | sha256sum -c -
          echo "645c04a42d5c0f6eb6208f1a4fa2773ee24dbb40119207f2bc506861e499fad9  tools/v16-sync.part.01" | sha256sum -c -
          echo "8c158e804c02402bbd9baf586f29c956d8ef4d7258926859e5cfa5809efca65e  tools/v16-sync.part.02" | sha256sum -c -
          echo "06ad3a1020a1cd063fb31772b57c19ab6ccfee7f48d46fce5386ed8d93da9180  tools/v16-sync.part.03" | sha256sum -c -
          echo "2bd3a90e6e12479a456811166fed3a80fa235d68fd60543c88a3dc8cbc40c88c  tools/v16-sync.part.04" | sha256sum -c -
          echo "e352e565844986ce23c8da508016b7c2712475453490060c91a2ffe5b42dffbf  tools/v16-sync.part.05" | sha256sum -c -
          echo "6116b5a4f733a9e477a2b98354dc69380b5e1f8204172ccbac840f834328f7b0  tools/v16-sync.part.06" | sha256sum -c -
          cat tools/v16-sync.part.00 tools/v16-sync.part.01 tools/v16-sync.part.02 tools/v16-sync.part.03 tools/v16-sync.part.04 tools/v16-sync.part.05 tools/v16-sync.part.06 > /tmp/v16-sync.b64
          echo "547783a546d54ae6debfe3bbda304e09a45e1891a71d231ec4737fb72817634b  /tmp/v16-sync.b64" | sha256sum -c -
          base64 --decode /tmp/v16-sync.b64 > /tmp/v16-sync.tar.gz
          echo "530ea1592cb8d7cda026621e4d35391cc8e074051407a2cf99db40d93714253f  /tmp/v16-sync.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v16-sync.tar.gz

      - name: Run V1.6 source contract checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test-local-web-dashboard-v16.py
          python -m py_compile local-engine/headless_web_dashboard.py scripts/test-local-web-dashboard-v16.py
          node --check local-engine/web-dashboard/galaxy-v16.js

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/v16-sync.tar.gz.b64 \
                    tools/v16-sync.part.00 tools/v16-sync.part.01 tools/v16-sync.part.02 \
                    tools/v16-sync.part.03 tools/v16-sync.part.04 tools/v16-sync.part.05 \
                    tools/v16-sync.part.06 .github/workflows/_apply-v16-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(local-engine): sync V1.6 modern workbench UI"
          git push origin HEAD:ui/v1.6-modern-workbench
