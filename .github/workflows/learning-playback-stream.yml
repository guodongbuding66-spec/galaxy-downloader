name: Learning Playback Stream

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_learning_media_http.py'
      - 'local-engine/headless_api.py'
      - 'local-engine/media_library.py'
      - 'local-engine/test_headless_learning_media_http.py'
      - '.github/workflows/learning-playback-stream.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_learning_media_http.py'
      - 'local-engine/headless_api.py'
      - 'local-engine/media_library.py'
      - 'local-engine/test_headless_learning_media_http.py'
      - '.github/workflows/learning-playback-stream.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile playback contract
        run: python -m py_compile local-engine/headless_learning_media_http.py local-engine/headless_api.py local-engine/test_headless_learning_media_http.py

      - name: Run playback streaming tests
        run: python local-engine/test_headless_learning_media_http.py
