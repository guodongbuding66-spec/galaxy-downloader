name: Headless Torrent Upload

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_torrent_upload.py'
      - 'local-engine/headless_transfer_http.py'
      - 'local-engine/headless_transfer_api.py'
      - 'local-engine/transfer_center.py'
      - 'local-engine/headless_api.py'
      - 'scripts/test-local-headless-torrent-upload.py'
      - '.github/workflows/headless-torrent-upload.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_torrent_upload.py'
      - 'local-engine/headless_transfer_http.py'
      - 'local-engine/headless_transfer_api.py'
      - 'local-engine/transfer_center.py'
      - 'local-engine/headless_api.py'
      - 'scripts/test-local-headless-torrent-upload.py'
      - '.github/workflows/headless-torrent-upload.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile torrent upload contract
        run: python -m py_compile local-engine/headless_torrent_upload.py local-engine/headless_transfer_http.py scripts/test-local-headless-torrent-upload.py

      - name: Run torrent upload contract test
        run: python scripts/test-local-headless-torrent-upload.py
