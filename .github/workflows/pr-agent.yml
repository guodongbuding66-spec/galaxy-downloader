name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: >-
      ${{
        github.event.sender.type != 'Bot'
        && (
          (
            github.event_name == 'pull_request'
            && github.event.pull_request.draft == false
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
          )
          ||
          (
            github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          )
        )
      }}
    name: Run PR Agent advisory review
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent action step
        id: pragent
        continue-on-error: true
        # Pin the third-party action to the immutable v0.44.0 release commit.
        # This job receives a model API secret and write-capable GitHub token,
        # so a moving branch such as @main is not an acceptable trust boundary.
        uses: the-pr-agent/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6 # v0.44.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

      - name: Record advisory service failure
        if: ${{ steps.pragent.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo '### PR Agent advisory unavailable'
            echo
            echo 'The external PR review service failed or was rate-limited. Product CI remains authoritative; retry the advisory review later or request it manually from a PR comment.'
          } >> "$GITHUB_STEP_SUMMARY"
