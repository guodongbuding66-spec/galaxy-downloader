name: Apply Local Engine V0.2 external yt-dlp patch

on:
  push:
    branches:
      - feat/local-engine-updatable-ytdlp
    paths:
      - '.github/workflows/v02-apply-external-ytdlp.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-engine-updatable-ytdlp
          fetch-depth: 0

      - name: Patch engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('local-engine/engine.py')
          text = path.read_text(encoding='utf-8')

          import_marker = "from yt_dlp.utils import DownloadCancelled, DownloadError\n"
          import_block = """from external_ytdlp import (\n    ExternalYtDlpError,\n    build_external_command,\n    download_with_external_ytdlp,\n    external_ytdlp_path,\n    update_external_ytdlp_if_due,\n)\n"""
          if import_block not in text:
              if import_marker not in text:
                  raise SystemExit('yt-dlp import marker not found')
              text = text.replace(import_marker, import_marker + "\n" + import_block, 1)

          self_test_marker = """    assert \"abr<=192\" in selector\n\n    try:\n"""
          self_test_block = """    assert \"abr<=192\" in selector\n\n    external_command = build_external_command(\n        Path(\"yt-dlp.exe\"),\n        job.source_url,\n        format_selector=selector,\n        output_template=\"%(title)s.%(ext)s\",\n        ffmpeg_location=Path(\"ffmpeg\"),\n        browser=job.browser,\n        playlist=job.playlist,\n        include_subtitle=job.include_subtitle,\n        subtitle_language=job.subtitle_lang,\n        include_cover=job.include_cover,\n    )\n    assert \"--cookies-from-browser\" in external_command\n    assert \"edge\" in external_command\n    assert \"--embed-subs\" in external_command\n    assert \"--embed-thumbnail\" in external_command\n    assert external_command[-1] == job.source_url\n\n    try:\n"""
          if 'external_command = build_external_command(' not in text:
              if self_test_marker not in text:
                  raise SystemExit('self-test marker not found')
              text = text.replace(self_test_marker, self_test_block, 1)

          method_marker = """    def build_options(self) -> dict:\n"""
          method_block = """    def external_progress_hook(\n        self,\n        percent: float,\n        speed: str,\n        eta: str,\n        downloaded: str,\n        total: str,\n    ) -> None:\n        self.ui(self.percent_var.set, percent)\n        self.ui(self.speed_var.set, speed or \"—\")\n        self.ui(self.eta_var.set, eta or \"—\")\n        size = downloaded or \"—\"\n        if total and total != \"—\":\n            size = f\"{size} / {total}\"\n        self.ui(self.size_var.set, size)\n        self.set_status(\"Downloading\", \"Using the current yt-dlp extractor on this computer\")\n\n    def external_status_hook(self, line: str) -> None:\n        if not line:\n            return\n        self.set_status(\"Preparing media\", line[:220])\n\n    def build_options(self) -> dict:\n"""
          if 'def external_progress_hook(' not in text:
              if method_marker not in text:
                  raise SystemExit('build_options marker not found')
              text = text.replace(method_marker, method_block, 1)

          run_marker = """    def _run_job(self) -> None:\n        assert self.job is not None\n        try:\n            with YoutubeDL(self.build_options()) as ydl:\n"""
          run_block = """    def _run_external_job(self, executable: Path) -> bool:\n        assert self.job is not None\n        self.set_status(\"Updating extractor\", \"Checking the official yt-dlp nightly channel\")\n        attempted, version = update_external_ytdlp_if_due(executable, app_dir())\n        if self.cancel_event.is_set():\n            raise DownloadCancelled(\"Cancelled by user\")\n        if attempted:\n            detail = f\"yt-dlp {version}\" if version else \"Continuing with the installed yt-dlp binary\"\n            self.set_status(\"Extractor ready\", detail)\n\n        output_dir = default_download_dir()\n        try:\n            final_path = download_with_external_ytdlp(\n                executable,\n                self.job.source_url,\n                format_selector=format_selector(self.job),\n                output_template=str(output_dir / \"%(title).180B [%(id)s].%(ext)s\"),\n                ffmpeg_location=ffmpeg_dir(),\n                browser=self.job.browser,\n                playlist=self.job.playlist,\n                include_subtitle=self.job.include_subtitle,\n                subtitle_language=self.job.subtitle_lang,\n                include_cover=self.job.include_cover,\n                cancelled=self.cancel_event.is_set,\n                on_progress=self.external_progress_hook,\n                on_status=self.external_status_hook,\n            )\n        except ExternalYtDlpError as exc:\n            if self.cancel_event.is_set():\n                raise DownloadCancelled(\"Cancelled by user\") from exc\n            self.set_status(\"Retrying with embedded extractor\", str(exc)[:220])\n            return False\n\n        if final_path:\n            self.last_path = final_path\n        self.ui(self.percent_var.set, 100)\n        return True\n\n    def _run_job(self) -> None:\n        assert self.job is not None\n        try:\n            external = external_ytdlp_path(app_dir())\n            if external and self._run_external_job(external):\n                self.set_status(\"Completed\", \"The finished media file is saved on this computer\")\n                return\n\n            with YoutubeDL(self.build_options()) as ydl:\n"""
          if 'def _run_external_job(' not in text:
              if run_marker not in text:
                  raise SystemExit('_run_job marker not found')
              text = text.replace(run_marker, run_block, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- local-engine/engine.py; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/engine.py
          git commit -m 'feat: prefer self-updating external yt-dlp with fallback'
          git push origin HEAD:feat/local-engine-updatable-ytdlp
