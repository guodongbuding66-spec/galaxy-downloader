name: Media Cleanup Suggestion Workbench Bootstrap

on:
  push:
    branches:
      - feat/media-cleanup-suggestion-workbench
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/media-cleanup-suggestion-workbench
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Integrate suggestion review controls
        run: python scripts/integrate-media-cleanup-suggestion-workbench.py

      - name: Validate integration
        run: |
          python -m py_compile local-engine/media_cleanup_suggestions.py local-engine/media_cleanup_workbench.py
          python scripts/test-local-media-cleanup-suggestions.py
          python scripts/test-local-media-cleanup-workbench.py

      - name: Commit integrated workbench
        shell: bash
        run: |
          if git diff --quiet -- local-engine/media_cleanup_workbench.py; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-engine/media_cleanup_workbench.py
          git commit -m "feat(local-engine): review automatic cleanup suggestions in workbench"
          git push origin HEAD:feat/media-cleanup-suggestion-workbench
