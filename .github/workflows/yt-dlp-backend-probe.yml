name: yt-dlp Backend Probe

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'scripts/yt-dlp-backend-probe.py'
      - '.github/workflows/yt-dlp-backend-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest yt-dlp
        run: python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp
      - name: Probe self-hosted extraction and media access
        run: python scripts/yt-dlp-backend-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-dlp-backend-probe
          path: platform-smoke-artifacts/yt-dlp-backend-probe.json
          retention-days: 14
