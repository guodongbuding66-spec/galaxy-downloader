name: yt-dlp Backend Probe

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'scripts/yt-dlp-backend-probe.py'
      - '.github/workflows/yt-dlp-backend-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install latest yt-dlp
        run: python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp
      - name: Probe self-hosted extraction and media access
        run: python scripts/yt-dlp-backend-probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: yt-dlp-backend-probe
          path: platform-smoke-artifacts/yt-dlp-backend-probe.json
          retention-days: 14
