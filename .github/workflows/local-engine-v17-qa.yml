name: Local Engine V1.7 QA

on:
  push:
    branches:
      - fix/v1.7-homedepot-native-ui
    paths:
      - 'local-engine/**'
      - '.interface-design/**'
      - '.github/workflows/local-engine-v17-qa.yml'
  pull_request:
    paths:
      - 'local-engine/**'
      - '.interface-design/**'
      - '.github/workflows/local-engine-v17-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-engine-v17-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-and-homedepot:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test and build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r local-engine/requirements.txt
          python -m pip install "pillow>=11,<12" pyinstaller

      - name: Run image, UI, DPI and native self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'local-engine').Path
          python local-engine/image_resolution.py
          python local-engine/home_depot_graphql.py
          python local-engine/home_depot_direct.py
          python local-engine/home_depot_policy.py
          python local-engine/desktop_dpi.py
          python local-engine/desktop_original_images.py
          python local-engine/desktop_design_tokens.py
          python local-engine/desktop_ui.py
          python local-engine/desktop_native_v17.py
          python local-engine/entrypoint.py --self-test

      - name: Live Home Depot original-image test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'local-engine').Path
          python local-engine/test_homedepot_live.py

      - name: Render Home Depot QA evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path qa | Out-Null
          @'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          data = json.loads(Path('homedepot-live-result.json').read_text(encoding='utf-8'))
          best = data.get('mainBest') or {}
          parser = data.get('productionParser') or {}
          saved = data.get('productionDownloader') or {}
          image = Image.new('RGB', (1280, 760), '#11151B')
          draw = ImageDraw.Draw(image)
          try:
              title = ImageFont.truetype('C:/Windows/Fonts/segoeuib.ttf', 34)
              body = ImageFont.truetype('C:/Windows/Fonts/segoeui.ttf', 22)
              small = ImageFont.truetype('C:/Windows/Fonts/segoeui.ttf', 18)
          except OSError:
              title = body = small = ImageFont.load_default()
          draw.text((56, 46), 'Galaxy Local Engine · Home Depot Live QA', font=title, fill='#F4F6F8')
          draw.text((56, 104), 'Internet #700380885 · Model hh-816 · exact user URL + public THD CDN', font=body, fill='#B9C1CC')
          draw.rounded_rectangle((56, 158, 1224, 482), radius=10, fill='#171D25', outline='#303A48', width=2)
          draw.text((88, 190), 'Public product derivative supplied to the test', font=small, fill='#8793A3')
          draw.text((88, 222), '...hh-816-64_600.jpg  →  600 × 600 px', font=body, fill='#F4F6F8')
          draw.text((88, 278), 'Largest decoded dimensions verified from public CDN', font=small, fill='#8793A3')
          draw.text((88, 314), f"{best.get('width', '?')} × {best.get('height', '?')} px", font=title, fill='#66C396')
          draw.text((88, 365), 'Production image downloader saved', font=small, fill='#8793A3')
          draw.text((88, 397), f"{saved.get('width', '?')} × {saved.get('height', '?')} px · {saved.get('suffix', '?')}", font=body, fill='#F4F6F8')
          draw.text((88, 442), 'Suffix _4000 is only a CDN variant name; decoded pixels are authoritative.', font=small, fill='#B9C1CC')
          if parser.get('realProductAsset'):
              parser_text, parser_color = f"Exact page parser: product assets discovered ({parser.get('imageCount', 0)} image records)", '#66C396'
          elif parser.get('success'):
              parser_text, parser_color = 'Exact page parser: FAIL — non-product asset accepted', '#E47777'
          else:
              parser_text, parser_color = f"Exact page parser: safely gated ({parser.get('code') or 'blocked'})", '#E0B26D'
          draw.text((56, 526), parser_text, font=body, fill=parser_color)
          passed = max(int(best.get('width') or 0), int(best.get('height') or 0)) > 600 and max(int(saved.get('width') or 0), int(saved.get('height') or 0)) > 600 and not (parser.get('success') and not parser.get('realProductAsset'))
          draw.text((56, 586), 'Result: PASS — escaped thumbnail ceiling and verified production download' if passed else 'Result: FAIL', font=body, fill='#66C396' if passed else '#E47777')
          draw.text((56, 650), 'Public Home Depot / THD resources only · no TinyFish · no paid scraper', font=small, fill='#8793A3')
          draw.text((56, 688), 'Public GraphQL → local Edge/Chrome traffic → HTML fallback; actual decoded pixels decide image quality.', font=small, fill='#8793A3')
          image.save('qa/homedepot-live-result.png')
          '@ | python -

      - name: Capture public Home Depot page with Edge
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Continue'
          $edgeCandidates = @(
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($edge) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot="$(Resolve-Path .)\qa\homedepot-page.png" "https://www.homedepot.com/p/700380885"
          }

      - name: Generate application icon
        shell: pwsh
        run: python local-engine/generate_icon.py --output local-engine/GalaxyLocalEngine.ico

      - name: Build native Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name GalaxyLocalEngine `
            --icon "local-engine/GalaxyLocalEngine.ico" `
            --collect-all yt_dlp `
            --add-data "local-engine/VERSION;." `
            local-engine/entrypoint.py

      - name: Packaged EXE UI smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath 'dist/GalaxyLocalEngine.exe' -ArgumentList '--ui-smoke-test' -PassThru
          if (-not $process.WaitForExit(25000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged GalaxyLocalEngine.exe UI smoke timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged UI smoke exited $($process.ExitCode)" }

      - name: Capture and validate native Tk workbench
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'local-engine').Path
          @'
          import sys, time, tkinter as tk, tkinter.font as tkfont
          from pathlib import Path
          from PIL import ImageGrab
          sys.path.insert(0, str(Path('local-engine').resolve()))
          import entrypoint
          import engine

          app = engine.EngineWindow(None)
          try:
              # Exercise a compact but supported desktop viewport instead of
              # forcing the window below its production minimum. UI Skills' key
              # requirement is a readable label and >=44px target, not exact
              # equality with Tk's requested geometry.
              app.minsize(1000, 700)
              app.geometry('1020x720+2+2')
              app.update_idletasks()
              app.deiconify()
              app.lift()
              app.update()
              time.sleep(0.6)
              app.update()
              root_x, root_y = app.winfo_rootx(), app.winfo_rooty()
              root_w, root_h = app.winfo_width(), app.winfo_height()
              outside = []
              target_failures = []
              def inspect(widget):
                  try:
                      mapped = bool(widget.winfo_ismapped())
                  except tk.TclError:
                      return
                  if mapped and isinstance(widget, tk.Button):
                      x, y = widget.winfo_rootx() - root_x, widget.winfo_rooty() - root_y
                      w, h = widget.winfo_width(), widget.winfo_height()
                      label = str(widget.cget('text'))
                      if x < 0 or y < 0 or x + w > root_w or y + h > root_h:
                          outside.append((label, x, y, w, h))
                      if label.strip():
                          try:
                              measured = tkfont.Font(master=app, font=widget.cget('font')).measure(label)
                          except tk.TclError:
                              measured = 0
                          if h < 44 or w < measured + 12:
                              target_failures.append((label, w, h, measured))
                  for child in widget.winfo_children():
                      inspect(child)
              inspect(app)
              if outside:
                  raise RuntimeError(f'Visible native buttons are outside the workbench: {outside}')
              if target_failures:
                  raise RuntimeError(f'Visible native buttons fail 44px/text-fit gate: {target_failures}')
              original_button = getattr(app, '_original_images_button', None)
              if original_button is None or not original_button.winfo_ismapped():
                  raise RuntimeError('Native original-image action is not visible')
              if str(original_button.cget('text')) != '下载页面原图':
                  raise RuntimeError('Unexpected original-image button copy')
              measured = tkfont.Font(master=app, font=original_button.cget('font')).measure('下载页面原图')
              if original_button.winfo_height() < 44 or original_button.winfo_width() < measured + 12:
                  raise RuntimeError('Native original-image button is clipped or below the 44px target')
              shot = ImageGrab.grab(bbox=(root_x, root_y, root_x + root_w, root_y + root_h), all_screens=True)
              if shot.width < 980 or shot.height < 690:
                  raise RuntimeError(f'Native workbench screenshot unexpectedly small: {shot.width}x{shot.height}')
              shot.save('qa/native-workbench-v17.png')
              print(f'Captured native workbench: {shot.width}x{shot.height}; outside buttons: 0; target failures: 0')
          finally:
              try:
                  app.destroy()
              except tk.TclError:
                  pass
          '@ | python -

      - name: Upload V1.7 QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: galaxy-local-engine-v17-qa
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa/*.png
            homedepot-live-result.json
            dist/GalaxyLocalEngine.exe
