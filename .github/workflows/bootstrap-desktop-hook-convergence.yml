name: Bootstrap Desktop Hook Convergence

on:
  push:
    branches:
      - refactor/local-engine-desktop-hooks
    paths:
      - '.github/workflows/bootstrap-desktop-hook-convergence.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refactor/local-engine-desktop-hooks

      - name: Replace recursive desktop wrappers with ordered hooks
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one {label}, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ui = Path('local-engine/desktop_ui.py')
          replace_once(
              ui,
              'from typing import Any, Callable\n\nfrom media_policy import aria2c_available, load_preferences, save_preferences\n',
              'from typing import Any, Callable\n\nfrom desktop_hooks import run_after_build_ui_hooks, run_queue_tick_hooks\nfrom media_policy import aria2c_available, load_preferences, save_preferences\n',
              'desktop hook imports',
          )
          replace_once(
              ui,
              '        window._galaxy_ui_tick()\n        window._galaxy_queue_tick()\n',
              '        run_after_build_ui_hooks(window)\n        window._galaxy_ui_tick()\n        window._galaxy_queue_tick()\n',
              'after-build hook dispatch',
          )
          replace_once(
              ui,
              '        try:\n            window.after(650, window._galaxy_queue_tick)\n        except tk.TclError:\n            pass\n\n    window_cls._build_ui = build_ui\n',
              '        try:\n            window.after(650, window._galaxy_queue_tick)\n        except tk.TclError:\n            pass\n        run_queue_tick_hooks(window)\n\n    window_cls._build_ui = build_ui\n',
              'queue hook dispatch',
          )

          extras = Path('local-engine/desktop_extras.py')
          replace_once(
              extras,
              'import desktop_ui as ui\n',
              'import desktop_ui as ui\nfrom desktop_hooks import register_after_build_ui_hook, register_queue_tick_hook\n',
              'extras hook imports',
          )
          replace_once(extras, '    original_build = window_cls._build_ui\n', '', 'extras original build wrapper')
          replace_once(extras, '    original_queue_tick = window_cls._galaxy_queue_tick\n', '', 'extras original queue wrapper')
          replace_once(extras, '    def build_ui(window) -> None:\n        original_build(window)\n', '    def after_build_ui(window) -> None:\n', 'extras build hook')
          replace_once(extras, '    def queue_tick(window) -> None:\n        original_queue_tick(window)\n', '    def queue_tick_hook(window) -> None:\n', 'extras queue hook')
          replace_once(
              extras,
              '    window_cls._build_ui = build_ui\n    window_cls._galaxy_queue_tick = queue_tick\n',
              '    register_after_build_ui_hook(window_cls, "desktop-extras", after_build_ui, order=110)\n    register_queue_tick_hook(window_cls, "desktop-extras", queue_tick_hook, order=110)\n',
              'extras hook registration',
          )

          manager = Path('local-engine/desktop_manager.py')
          replace_once(
              manager,
              'import desktop_ui as ui\n',
              'import desktop_ui as ui\nfrom desktop_hooks import register_after_build_ui_hook\n',
              'manager hook import',
          )
          replace_once(manager, '    original_build = window_cls._build_ui\n', '', 'manager original build wrapper')
          replace_once(manager, '    def build_ui(window) -> None:\n        original_build(window)\n', '    def after_build_ui(window) -> None:\n', 'manager build hook')
          replace_once(
              manager,
              '    window_cls._build_ui = build_ui\n',
              '    register_after_build_ui_hook(window_cls, "desktop-manager", after_build_ui, order=120)\n',
              'manager hook registration',
          )

          runtime = Path('local-engine/desktop_runtime.py')
          replace_once(
              runtime,
              'import desktop_ui as ui\n',
              'import desktop_ui as ui\nfrom desktop_hooks import register_after_build_ui_hook, register_queue_tick_hook\n',
              'runtime hook imports',
          )
          replace_once(runtime, '    original_build = window_cls._build_ui\n', '', 'runtime original build wrapper')
          replace_once(runtime, '    original_queue_tick = window_cls._galaxy_queue_tick\n', '', 'runtime original queue wrapper')
          replace_once(runtime, '    def build_ui(window) -> None:\n        original_build(window)\n', '    def after_build_ui(window) -> None:\n', 'runtime build hook')
          replace_once(runtime, '    def queue_tick(window) -> None:\n        original_queue_tick(window)\n', '    def queue_tick_hook(window) -> None:\n', 'runtime queue hook')
          replace_once(
              runtime,
              '    window_cls._build_ui = build_ui\n    window_cls._galaxy_queue_tick = queue_tick\n',
              '    register_after_build_ui_hook(window_cls, "desktop-runtime", after_build_ui, order=130)\n    register_queue_tick_hook(window_cls, "desktop-runtime", queue_tick_hook, order=130)\n',
              'runtime hook registration',
          )

          center = Path('local-engine/task_center.py')
          replace_once(
              center,
              'import desktop_ui as ui\n',
              'import desktop_ui as ui\nfrom desktop_hooks import register_after_build_ui_hook\n',
              'task center hook import',
          )
          replace_once(center, '    original_build = window_cls._build_ui\n', '', 'task center original build wrapper')
          replace_once(center, '    def build_ui(window) -> None:\n        original_build(window)\n', '    def after_build_ui(window) -> None:\n', 'task center build hook')
          replace_once(
              center,
              '    window_cls._build_ui = build_ui\n',
              '    register_after_build_ui_hook(window_cls, "task-center", after_build_ui, order=150)\n',
              'task center hook registration',
          )

      - name: Compile desktop modules
        run: |
          python -m py_compile \
            local-engine/desktop_hooks.py \
            local-engine/desktop_ui.py \
            local-engine/desktop_extras.py \
            local-engine/desktop_manager.py \
            local-engine/desktop_runtime.py \
            local-engine/task_center.py

      - name: Run architecture contract
        run: python scripts/test-local-desktop-hooks.py

      - name: Run existing deterministic desktop policy tests
        run: |
          python scripts/test-local-manager-policy.py
          python scripts/test-local-runtime-policy.py
          python scripts/test-local-pause-resume.py

      - name: Commit Python convergence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/desktop_ui.py local-engine/desktop_extras.py local-engine/desktop_manager.py local-engine/desktop_runtime.py local-engine/task_center.py
          git commit -m 'refactor(local-engine): replace recursive desktop wrappers with hooks'
          git push origin HEAD:refactor/local-engine-desktop-hooks
