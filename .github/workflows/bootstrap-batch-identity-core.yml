name: Bootstrap Batch Identity Core

on:
  push:
    branches:
      - feature/batch-identity-core
    paths:
      - '.github/workflows/bootstrap-batch-identity-core.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/batch-identity-core

      - name: Apply Batch identity wiring
        run: |
          python scripts/integrate-batch-identity-core.py
          python scripts/integrate-batch-identity-test-loader.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Local Engine dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Batch identity path
        run: |
          python -m py_compile \
            local-engine/batch_identity.py \
            local-engine/batch_input.py \
            local-engine/batch_submission.py \
            local-engine/batch_bridge.py \
            local-engine/job_queue.py \
            local-engine/job_history.py \
            local-engine/pause_resume_policy.py \
            local-engine/entrypoint.py

      - name: Run targeted Batch identity tests
        run: |
          python scripts/test-local-batch-input.py
          python scripts/test-local-batch-submission.py
          python scripts/test-local-batch-bridge.py
          python scripts/test-local-batch-identity.py
          python scripts/test-local-job-queue.py
          python scripts/test-local-pause-resume.py

      - name: Verify identity anchors
        run: |
          grep -F 'payload["batchId"] = batch_id' local-engine/batch_submission.py
          grep -F 'install_batch_identity_policy(engine)' local-engine/entrypoint.py
          grep -F '"batchId": record.get("batchId")' local-engine/pause_resume_policy.py
          grep -F '**_batch_queue_status_fields(queued.job)' local-engine/job_queue.py
          grep -F 'sys.path.insert(0, str(LOCAL_ENGINE))' scripts/test-local-pause-resume.py

      - name: Commit permanent product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            local-engine/batch_submission.py \
            local-engine/batch_bridge.py \
            local-engine/job_queue.py \
            local-engine/job_history.py \
            local-engine/pause_resume_policy.py \
            local-engine/entrypoint.py \
            scripts/test-local-job-queue.py \
            scripts/test-local-pause-resume.py \
            .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'feat(local-engine): propagate Batch identity through task state'
          git push origin HEAD:feature/batch-identity-core
