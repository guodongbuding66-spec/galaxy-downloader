name: Design System

on:
  pull_request:
    paths:
      - 'docs/design/**'
      - 'local-engine/desktop_design_tokens.py'
      - 'local-engine/desktop_ui.py'
      - 'local-engine/_desktop_ui_impl.py'
      - 'scripts/test-design-system-docs.py'
      - 'scripts/test-desktop-ui-design-tokens.py'
      - '.github/workflows/design-system.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/design/**'
      - 'local-engine/desktop_design_tokens.py'
      - 'local-engine/desktop_ui.py'
      - 'local-engine/_desktop_ui_impl.py'
      - 'scripts/test-design-system-docs.py'
      - 'scripts/test-desktop-ui-design-tokens.py'
      - '.github/workflows/design-system.yml'

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v6
        with:
          python-version: '3.13'

      - name: Validate design system contract
        run: |
          python local-engine/desktop_design_tokens.py
          python local-engine/desktop_ui.py
          python scripts/test-desktop-ui-design-tokens.py
          python scripts/test-design-system-docs.py
