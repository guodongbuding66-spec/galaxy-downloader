name: Tool Manager Bootstrap

on:
  push:
    branches:
      - feat/tool-manager-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/tool-manager-core
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Integrate tool manager
        run: python scripts/integrate-tool-manager.py

      - name: Validate tool manager
        run: |
          python -m py_compile local-engine/tool_manager.py local-engine/desktop_tools.py local-engine/entrypoint.py scripts/test-local-tool-manager.py
          python scripts/test-local-tool-manager.py
          python local-engine/entrypoint.py --self-test

      - name: Commit integrated entrypoint
        shell: bash
        run: |
          if git diff --quiet -- local-engine/entrypoint.py; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-engine/entrypoint.py
          git commit -m "feat(local-engine): install tool manager and desktop controls"
          git push origin HEAD:feat/tool-manager-core
