name: Fix V1.6 dashboard contract

on:
  push:
    branches:
      - ui/v1.6-modern-workbench
    paths:
      - .github/workflows/_fix-v16-dashboard-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update legacy dashboard branding assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('local-engine/test_headless_web_dashboard.py')
          text = p.read_text(encoding='utf-8')
          old = 'self.assertIn(b"Galaxy Dashboard", body)'
          new = 'self.assertIn(b"Galaxy Local Engine", body)'
          if old not in text:
              raise SystemExit('legacy assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python local-engine/test_headless_web_dashboard.py
      - name: Commit contract update
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_fix-v16-dashboard-contract.yml
          git add local-engine/test_headless_web_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(local-engine): update dashboard branding contract for V1.6"
          git push origin HEAD:ui/v1.6-modern-workbench
