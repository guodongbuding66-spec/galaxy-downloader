name: Galaxy 54 Integration

on:
  pull_request:
    paths:
      - 'local-engine/**'
      - 'plugins/**'
      - 'Dockerfile.headless'
      - 'docker-compose.headless.yml'
      - 'docs/HEADLESS-NAS.md'
      - 'scripts/test-local-galaxy54.py'
      - '.github/workflows/galaxy54.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/**'
      - 'plugins/**'
      - 'Dockerfile.headless'
      - 'docker-compose.headless.yml'
      - 'scripts/test-local-galaxy54.py'
      - '.github/workflows/galaxy54.yml'

permissions:
  contents: read

concurrency:
  group: galaxy54-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advanced-core:
    name: Advanced Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: local-engine/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Galaxy 54 modules
        run: >-
          python -m py_compile
          local-engine/ai_provider_manager.py
          local-engine/bilibili_advanced.py
          local-engine/content_providers.py
          local-engine/desktop_ai.py
          local-engine/desktop_bandwidth.py
          local-engine/desktop_clipboard.py
          local-engine/desktop_hotkey.py
          local-engine/desktop_learning.py
          local-engine/desktop_marketplace.py
          local-engine/desktop_platform_features.py
          local-engine/desktop_providers.py
          local-engine/desktop_transfers.py
          local-engine/galaxy_cli.py
          local-engine/headless_service.py
          local-engine/learning_workspace.py
          local-engine/local_media_import.py
          local-engine/media_postprocess.py
          local-engine/music_workspace.py
          local-engine/plugin_host.py
          local-engine/plugin_marketplace.py
          local-engine/reader_library.py
          local-engine/subscription_rules.py
          local-engine/subscription_scheduler.py
          local-engine/subscriptions.py
          local-engine/telegram_transfer.py
          local-engine/transcript_workspace.py
          local-engine/transfer_center.py

      - name: Run Galaxy 54 advanced self-tests
        run: python scripts/test-local-galaxy54.py

      - name: Run CLI self-test
        run: python local-engine/galaxy_cli.py --self-test

      - name: Run headless API self-test
        run: python local-engine/headless_service.py --self-test

  headless-container:
    name: Headless Docker / NAS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Compose model
        env:
          GALAXY_HEADLESS_TOKEN: integration-test-token-0123456789abcdef
        run: docker compose -f docker-compose.headless.yml config --quiet

      - name: Build headless image
        run: docker build -f Dockerfile.headless -t galaxy-local-engine:ci .

      - name: Run headless container smoke
        env:
          GALAXY_HEADLESS_TOKEN: integration-test-token-0123456789abcdef
        run: |
          docker run -d --rm \
            --name galaxy-headless-ci \
            -e GALAXY_HEADLESS_TOKEN="$GALAXY_HEADLESS_TOKEN" \
            -p 127.0.0.1:17837:17837 \
            galaxy-local-engine:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17837/health >/tmp/galaxy-health.json; then
              cat /tmp/galaxy-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs galaxy-headless-ci
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker stop galaxy-headless-ci >/dev/null 2>&1 || true
