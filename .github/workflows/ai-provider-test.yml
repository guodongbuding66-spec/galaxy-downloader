name: AI Provider Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/ai_provider_runtime.py'
      - 'local-engine/headless_ai_api.py'
      - 'local-engine/headless_ai_http.py'
      - 'local-engine/web-dashboard/ai-subscriptions.js'
      - 'scripts/test-local-ai-provider-test.py'
      - 'scripts/test-local-headless-ai-http.py'
      - '.github/workflows/ai-provider-test.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/ai_provider_runtime.py'
      - 'local-engine/headless_ai_api.py'
      - 'local-engine/headless_ai_http.py'
      - 'local-engine/web-dashboard/ai-subscriptions.js'
      - 'scripts/test-local-ai-provider-test.py'
      - 'scripts/test-local-headless-ai-http.py'
      - '.github/workflows/ai-provider-test.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Provider Test contract
        run: python -m py_compile local-engine/ai_provider_runtime.py local-engine/headless_ai_api.py local-engine/headless_ai_http.py scripts/test-local-ai-provider-test.py scripts/test-local-headless-ai-http.py

      - name: Run Provider Test contract
        run: python scripts/test-local-ai-provider-test.py

      - name: Run production AI HTTP regression
        run: python scripts/test-local-headless-ai-http.py
