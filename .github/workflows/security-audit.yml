name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.8.0
          runtime: node@22
          install: false
          require-lockfile: true

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  python-audit:
    name: Python dependency audit (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - local-engine/requirements.txt
          - container-backend/requirements.txt
          - container-backend/requirements-dev.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check 'pip-audit>=2.9,<3'

      - name: Audit Python dependencies
        run: python -m pip_audit -r '${{ matrix.requirements }}' --progress-spinner=off
