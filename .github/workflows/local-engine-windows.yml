name: Local Engine Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/**'
      - '.github/workflows/local-engine-windows.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/**'
      - '.github/workflows/local-engine-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile-check engine source
        run: python -m py_compile local-engine/entrypoint.py local-engine/engine.py local-engine/bridge.py local-engine/web_document.py local-engine/document_policy.py local-engine/dynamic_document.py local-engine/external_ytdlp.py local-engine/wechat_channels.py

      - name: Validate source self-test and version
        shell: pwsh
        run: |
          python local-engine/entrypoint.py --self-test
          $expected = (Get-Content 'local-engine/VERSION' -Raw).Trim()
          $actual = (python local-engine/entrypoint.py --version | Select-Object -Last 1).Trim()
          if ($actual -ne $expected) {
            throw "Engine version '$actual' does not match VERSION '$expected'"
          }

      - name: Build portable executable
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --add-data "local-engine/VERSION;."
          local-engine/entrypoint.py

      - name: Validate packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/GalaxyLocalEngine.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GalaxyLocalEngine.exe self-test exited with $($process.ExitCode)"
          }

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/GalaxyLocalEngine.exe dist/package/GalaxyLocalEngine.exe
          Copy-Item local-engine/install.cmd dist/package/install.cmd
          Copy-Item local-engine/install.ps1 dist/package/install.ps1
          Copy-Item local-engine/uninstall.cmd dist/package/uninstall.cmd
          Copy-Item local-engine/uninstall.ps1 dist/package/uninstall.ps1
          Copy-Item local-engine/README.md dist/package/README.md
          Copy-Item 'local-engine/使用说明.txt' 'dist/package/使用说明.txt'
          Copy-Item local-engine/VERSION dist/package/VERSION

      - name: Add verified offline FFmpeg and yt-dlp
        shell: pwsh
        run: ./local-engine/prepare-bundle.ps1 -PackageDir dist/package

      - name: Validate release package contents
        shell: pwsh
        run: |
          $required = @(
            'GalaxyLocalEngine.exe',
            'yt-dlp.exe',
            'ffmpeg\bin\ffmpeg.exe',
            'ffmpeg\bin\ffprobe.exe',
            'install.cmd',
            'install.ps1',
            'uninstall.cmd',
            'uninstall.ps1',
            'README.md',
            '使用说明.txt',
            'VERSION'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path 'dist/package' $file))) {
              throw "Release package is missing $file"
            }
          }

      - name: Validate installer and protocol lifecycle
        shell: pwsh
        run: |
          $testInstall = Join-Path $env:RUNNER_TEMP 'GalaxyLocalEngineTest'
          & 'dist/package/install.ps1' -InstallDir $testInstall -NoLaunch

          $protocolCommandPath = 'HKCU:\Software\Classes\galaxy-downloader\shell\open\command'
          if (-not (Test-Path $protocolCommandPath)) {
            throw 'galaxy-downloader protocol registration was not created'
          }
          $registeredCommand = (Get-Item $protocolCommandPath).GetValue('')
          $expectedExe = Join-Path $testInstall 'GalaxyLocalEngine.exe'
          if ($registeredCommand -notlike "*$expectedExe*") {
            throw "Protocol command does not target the installed executable: $registeredCommand"
          }

          foreach ($file in @('VERSION', 'yt-dlp.exe', 'ffmpeg\bin\ffmpeg.exe', 'ffmpeg\bin\ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $testInstall $file))) {
              throw "Portable install is missing $file"
            }
          }
          if (-not (Test-Path (Join-Path $testInstall 'downloads'))) {
            throw 'Portable installer did not create downloads folder'
          }

          $externalYtDlp = Join-Path $testInstall 'yt-dlp.exe'
          $externalVersion = (& $externalYtDlp --version | Select-Object -Last 1).Trim()
          if (-not $externalVersion) {
            throw 'Bundled yt-dlp.exe did not report a version'
          }
          Write-Host "Bundled yt-dlp version: $externalVersion"

          & 'dist/package/uninstall.ps1' -InstallDir $testInstall
          if (Test-Path 'HKCU:\Software\Classes\galaxy-downloader') {
            throw 'galaxy-downloader protocol registration remained after uninstall'
          }
          Remove-Item -Recurse -Force $testInstall -ErrorAction SilentlyContinue

      - name: Compress Windows package
        shell: pwsh
        run: Compress-Archive -Force -Path dist/package/* -DestinationPath dist/GalaxyLocalEngine-Windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyLocalEngine-Windows
          path: dist/GalaxyLocalEngine-Windows.zip
          if-no-files-found: error
          retention-days: 30
