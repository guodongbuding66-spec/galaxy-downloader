name: Music Playback Stream

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_music_media_http.py'
      - 'local-engine/headless_api.py'
      - 'local-engine/test_headless_music_media_http.py'
      - '.github/workflows/music-playback-stream.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_music_media_http.py'
      - 'local-engine/headless_api.py'
      - 'local-engine/test_headless_music_media_http.py'
      - '.github/workflows/music-playback-stream.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile playback stream contract
        run: python -m py_compile local-engine/headless_music_media_http.py local-engine/headless_api.py local-engine/test_headless_music_media_http.py

      - name: Run playback stream tests
        run: python local-engine/test_headless_music_media_http.py
