name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.8.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install -r local-engine/requirements.txt

      - name: Validate Python media policies
        run: |
          python3 -m py_compile \
            local-engine/entrypoint.py \
            local-engine/engine.py \
            local-engine/bridge.py \
            local-engine/bridge_submission_policy.py \
            local-engine/batch_identity.py \
            local-engine/batch_input.py \
            local-engine/batch_submission.py \
            local-engine/batch_bridge.py \
            local-engine/archive_policy.py \
            local-engine/media_cleanup.py \
            local-engine/media_cleanup_suggestions.py \
            local-engine/media_cleanup_workbench.py \
            local-engine/media_policy.py \
            local-engine/workspace_policy.py \
            local-engine/recovery_policy.py \
            local-engine/pause_resume_policy.py \
            local-engine/resume_bridge.py \
            local-engine/recovery_display.py \
            local-engine/failure_policy.py \
            local-engine/runtime_health.py \
            local-engine/runtime_storage.py \
            local-engine/tool_manager.py \
            local-engine/ffmpeg_manager.py \
            local-engine/tool_artifacts.py \
            local-engine/tool_sources.py \
            local-engine/tool_install_layout.py \
            local-engine/job_queue.py \
            local-engine/queue_controls.py \
            local-engine/job_history.py \
            local-engine/desktop_hooks.py \
            local-engine/desktop_ui.py \
            local-engine/desktop_extras.py \
            local-engine/desktop_manager.py \
            local-engine/desktop_runtime.py \
            local-engine/desktop_tools.py \
            local-engine/task_center.py \
            local-engine/update_check.py \
            local-engine/browser_auth.py \
            local-engine/wechat_channels.py \
            local-engine/image_archive_policy.py \
            local-engine/image_bridge.py \
            local-engine/image_download.py \
            local-engine/web_document.py \
            local-engine/document_policy.py \
            local-engine/document_markdown.py \
            local-engine/dynamic_document.py \
            local-engine/url_policy.py \
            local-engine/external_ytdlp.py \
            container-backend/app/main.py \
            container-backend/app/playback.py \
            container-backend/app/server.py
          python3 scripts/test-local-engine-policy.py
          python3 scripts/test-local-url-policy.py
          python3 scripts/test-local-document-policy.py
          python3 scripts/test-local-browser-auth.py
          python3 scripts/test-local-image-download.py
          python3 scripts/test-local-image-bridge.py
          python3 scripts/test-local-batch-input.py
          python3 scripts/test-local-batch-submission.py
          python3 scripts/test-local-batch-bridge.py
          python3 scripts/test-local-batch-identity.py
          python3 scripts/test-local-job-queue.py
          python3 scripts/test-local-bridge-submission.py
          python3 scripts/test-local-archive-policy.py
          python3 scripts/test-local-media-cleanup.py
          python3 scripts/test-local-media-cleanup-suggestions.py
          python3 scripts/test-local-media-cleanup-workbench.py
          python3 scripts/test-local-media-policy.py
          python3 scripts/test-local-image-archive-policy.py
          python3 scripts/test-local-manager-policy.py
          python3 scripts/test-local-runtime-policy.py
          python3 scripts/test-local-runtime-storage.py
          python3 scripts/test-local-tool-manager.py
          python3 scripts/test-local-ffmpeg-manager.py
          python3 scripts/test-local-tool-artifacts.py
          python3 scripts/test-local-tool-sources.py
          python3 scripts/test-local-tool-install-layout.py
          python3 scripts/test-local-recovery-policy.py
          python3 scripts/test-local-pause-resume.py
          python3 scripts/test-local-desktop-hooks.py
          python3 scripts/test-local-release-notes.py

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
