name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install -r local-engine/requirements.txt

      - name: Validate Python media policies
        run: |
          python3 -m py_compile \
            local-engine/entrypoint.py \
            local-engine/engine.py \
            local-engine/bridge.py \
            local-engine/bridge_submission_policy.py \
            local-engine/archive_policy.py \
            local-engine/media_policy.py \
            local-engine/workspace_policy.py \
            local-engine/recovery_policy.py \
            local-engine/failure_policy.py \
            local-engine/runtime_health.py \
            local-engine/job_queue.py \
            local-engine/queue_controls.py \
            local-engine/job_history.py \
            local-engine/desktop_ui.py \
            local-engine/desktop_extras.py \
            local-engine/desktop_manager.py \
            local-engine/desktop_runtime.py \
            local-engine/task_center.py \
            local-engine/update_check.py \
            local-engine/browser_auth.py \
            local-engine/wechat_channels.py \
            local-engine/image_archive_policy.py \
            local-engine/image_bridge.py \
            local-engine/image_download.py \
            local-engine/web_document.py \
            local-engine/document_policy.py \
            local-engine/document_markdown.py \
            local-engine/dynamic_document.py \
            local-engine/url_policy.py \
            local-engine/external_ytdlp.py \
            container-backend/app/main.py \
            container-backend/app/playback.py \
            container-backend/app/server.py
          python3 scripts/test-local-engine-policy.py
          python3 scripts/test-local-url-policy.py
          python3 scripts/test-local-document-policy.py
          python3 scripts/test-local-browser-auth.py
          python3 scripts/test-local-image-download.py
          python3 scripts/test-local-image-bridge.py
          python3 scripts/test-local-job-queue.py
          python3 scripts/test-local-bridge-submission.py
          python3 scripts/test-local-archive-policy.py
          python3 scripts/test-local-media-policy.py
          python3 scripts/test-local-image-archive-policy.py
          python3 scripts/test-local-manager-policy.py
          python3 scripts/test-local-runtime-policy.py
          python3 scripts/test-local-recovery-policy.py

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build
