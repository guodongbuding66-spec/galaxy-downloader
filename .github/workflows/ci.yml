name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.8.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pnpm install --frozen-lockfile
          python3 -m pip install -r local-engine/requirements.txt

      - name: Validate Python media policies
        run: |
          python3 -m py_compile \
            local-engine/entrypoint.py \
            local-engine/engine.py \
            local-engine/bridge.py \
            local-engine/bridge_submission_policy.py \
            local-engine/batch_identity.py \
            local-engine/batch_input.py \
            local-engine/batch_submission.py \
            local-engine/batch_bridge.py \
            local-engine/archive_policy.py \
            local-engine/media_cleanup.py \
            local-engine/media_cleanup_suggestions.py \
            local-engine/media_cleanup_workbench.py \
            local-engine/media_policy.py \
            local-engine/media_format_catalog.py \
            local-engine/exact_format_policy.py \
            local-engine/workspace_policy.py \
            local-engine/recovery_policy.py \
            local-engine/pause_resume_policy.py \
            local-engine/resume_bridge.py \
            local-engine/recovery_display.py \
            local-engine/failure_policy.py \
            local-engine/runtime_health.py \
            local-engine/runtime_storage.py \
            local-engine/tool_manager.py \
            local-engine/ffmpeg_manager.py \
            local-engine/ffmpeg_online_installer.py \
            local-engine/ffmpeg_update_status.py \
            local-engine/managed_tool_metadata.py \
            local-engine/managed_tool_registry.py \
            local-engine/managed_tool_actions.py \
            local-engine/tool_artifacts.py \
            local-engine/tool_sources.py \
            local-engine/tool_install_layout.py \
            local-engine/job_queue.py \
            local-engine/queue_controls.py \
            local-engine/job_history.py \
            local-engine/desktop_hooks.py \
            local-engine/desktop_ui.py \
            local-engine/desktop_quick_download.py \
            local-engine/desktop_extras.py \
            local-engine/desktop_manager.py \
            local-engine/desktop_runtime.py \
            local-engine/desktop_tools.py \
            local-engine/task_center.py \
            local-engine/update_check.py \
            local-engine/browser_auth.py \
            local-engine/wechat_channels.py \
            local-engine/image_archive_policy.py \
            local-engine/image_bridge.py \
            local-engine/image_download.py \
            local-engine/web_document.py \
            local-engine/document_policy.py \
            local-engine/document_markdown.py \
            local-engine/dynamic_document.py \
            local-engine/url_policy.py \
