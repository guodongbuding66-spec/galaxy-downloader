          python3 scripts/test-local-release-notes.py
          python3 scripts/test-local-galaxy54.py
          python3 local-engine/galaxy_cli.py --self-test
          python3 local-engine/headless_service.py --self-test

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

  headless-container:
    name: Headless Docker / NAS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Compose model
        env:
          GALAXY_HEADLESS_TOKEN: integration-test-token-0123456789abcdef
        run: docker compose -f docker-compose.headless.yml config --quiet

      - name: Build headless image
        run: docker build -f Dockerfile.headless -t galaxy-local-engine:ci .

      - name: Run headless container smoke
        env:
          GALAXY_HEADLESS_TOKEN: integration-test-token-0123456789abcdef
        run: |
          docker run -d --rm \
            --name galaxy-headless-ci \
            -e GALAXY_HEADLESS_TOKEN="$GALAXY_HEADLESS_TOKEN" \
            -p 127.0.0.1:17837:17837 \
            galaxy-local-engine:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17837/health >/tmp/galaxy-health.json; then
              cat /tmp/galaxy-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs galaxy-headless-ci
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker stop galaxy-headless-ci >/dev/null 2>&1 || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1cd1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
