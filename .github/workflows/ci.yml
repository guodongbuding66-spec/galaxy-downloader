name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Python media policies
        run: |
          python3 -m py_compile \
            local-engine/entrypoint.py \
            local-engine/bridge.py \
            local-engine/web_document.py \
            local-engine/document_policy.py \
            local-engine/external_ytdlp.py \
            container-backend/app/main.py \
            container-backend/app/playback.py \
            container-backend/app/server.py
          python3 scripts/test-local-engine-policy.py

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build
