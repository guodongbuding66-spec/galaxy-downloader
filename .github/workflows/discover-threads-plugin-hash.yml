name: Discover pinned Threads plugin hash

on:
  push:
    branches:
      - feat/local-engine-threads-plugin
    paths:
      - '.github/workflows/discover-threads-plugin-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: windows-latest
    steps:
      - name: Download exact pinned plugin and print SHA-256
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/tribixbite/yt-dlp-threads/c4c44141cb10715f94296a808f5d89a0d24dfe94/yt_dlp_plugins/extractor/threads.py'
          $path = Join-Path $env:RUNNER_TEMP 'threads.py'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $path
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "THREADS_PLUGIN_SHA256=$hash"
          Write-Host "THREADS_PLUGIN_BYTES=$((Get-Item $path).Length)"
