name: Runtime State Migration Bootstrap

on:
  push:
    branches:
      - feat/runtime-state-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/runtime-state-migration
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Integrate runtime state migration
        run: python scripts/integrate-runtime-state-migration.py

      - name: Validate migration
        run: |
          python -m py_compile \
            local-engine/runtime_storage.py \
            local-engine/workspace_policy.py \
            local-engine/job_history.py \
            local-engine/archive_policy.py \
            local-engine/media_policy.py \
            local-engine/runtime_health.py \
            local-engine/pause_resume_policy.py \
            local-engine/entrypoint.py \
            scripts/test-local-runtime-storage.py
          python scripts/test-local-runtime-storage.py
          python scripts/test-local-platform-paths.py
          python scripts/test-local-runtime-paths-policy.py
          python local-engine/entrypoint.py --self-test
          if grep -R --include='*.py' -n 'engine_module.app_dir() / "state"' local-engine | grep -v 'runtime_storage.py'; then
            echo 'legacy state path remains' >&2
            exit 1
          fi

      - name: Commit integrated migration
        shell: bash
        run: |
          if git diff --quiet -- \
            local-engine/archive_policy.py \
            local-engine/job_history.py \
            local-engine/media_policy.py \
            local-engine/pause_resume_policy.py \
            local-engine/runtime_health.py \
            local-engine/workspace_policy.py \
            local-engine/entrypoint.py; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            local-engine/archive_policy.py \
            local-engine/job_history.py \
            local-engine/media_policy.py \
            local-engine/pause_resume_policy.py \
            local-engine/runtime_health.py \
            local-engine/workspace_policy.py \
            local-engine/entrypoint.py
          git commit -m "feat(local-engine): migrate mutable state to runtime state dir"
          git push origin HEAD:feat/runtime-state-migration
