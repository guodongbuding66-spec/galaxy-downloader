name: Local Engine Unix Portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/**'
      - 'scripts/test-local-unix-bundle.py'
      - 'scripts/test-local-packaged-linux-tray.py'
      - '.github/workflows/local-engine-unix-portable.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/**'
      - 'scripts/test-local-unix-bundle.py'
      - 'scripts/test-local-packaged-linux-tray.py'
      - '.github/workflows/local-engine-unix-portable.yml'

permissions:
  contents: read

jobs:
  portable-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            os_name: linux
            arch: amd64
            artifact: GalaxyLocalEngine-Linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            artifact: GalaxyLocalEngine-Linux-arm64
          - label: macOS Intel
            runner: macos-15-intel
            os_name: darwin
            arch: amd64
            artifact: GalaxyLocalEngine-macOS-x64
          - label: macOS Apple Silicon
            runner: macos-15
            os_name: darwin
            arch: arm64
            artifact: GalaxyLocalEngine-macOS-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        if: matrix.os_name == 'darwin'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Local Engine dependencies
        if: matrix.os_name == 'darwin'
        run: python -m pip install -r local-engine/requirements.txt

      - name: Install Linux AppIndicator build runtime
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            python3-tk \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1 \
            dbus-x11 \
            xvfb \
            xauth
          /usr/bin/python3 -m venv --system-site-packages .venv-linux-package
          .venv-linux-package/bin/python -m pip install -r local-engine/requirements.txt
          .venv-linux-package/bin/python - <<'PY'
          import importlib.util
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('AyatanaAppIndicator3', '0.1')
          from gi.repository import AyatanaAppIndicator3, Gtk
          assert Gtk is not None
          assert AyatanaAppIndicator3 is not None
          assert importlib.util.find_spec('pystray') is not None
          assert importlib.util.find_spec('PIL') is not None
          assert importlib.util.find_spec('tkinter') is not None
          print('Linux GI/AppIndicator/Tk build dependencies OK')
          PY

      - name: Validate portable dependency policy
        run: |
          set -euo pipefail
          if [ '${{ matrix.os_name }}' = 'linux' ]; then
            PYTHON='.venv-linux-package/bin/python'
          else
            PYTHON='python'
          fi
          "$PYTHON" -m py_compile local-engine/prepare-unix-bundle.py scripts/test-local-unix-bundle.py
          "$PYTHON" scripts/test-local-unix-bundle.py
          "$PYTHON" local-engine/prepare-unix-bundle.py --package-dir unused --os '${{ matrix.os_name }}' --architecture '${{ matrix.arch }}' --print-plan

      - name: Validate source self-test
        run: |
          set -euo pipefail
          if [ '${{ matrix.os_name }}' = 'linux' ]; then
            .venv-linux-package/bin/python local-engine/entrypoint.py --self-test
          else
            python local-engine/entrypoint.py --self-test
          fi

      - name: Build Linux portable executable
        if: matrix.os_name == 'linux'
        run: >-
          .venv-linux-package/bin/pyinstaller
          --noconfirm
          --clean
          --onefile
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --hidden-import pystray._appindicator
          --hidden-import gi
          --hidden-import gi.repository.Gtk
          --hidden-import gi.repository.AyatanaAppIndicator3
          --add-data 'local-engine/VERSION:.'
          local-engine/entrypoint.py

      - name: Validate frozen Linux AppIndicator runtime
        if: matrix.os_name == 'linux'
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: >-
          timeout 35s
          dbus-run-session --
          xvfb-run -a
          .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py
          dist/GalaxyLocalEngine

      - name: Assemble Linux package and verified tools
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp dist/GalaxyLocalEngine dist/package/GalaxyLocalEngine
          cp local-engine/README.md dist/package/README.md
          cp 'local-engine/使用说明.txt' 'dist/package/使用说明.txt'
          cp local-engine/VERSION dist/package/VERSION
          .venv-linux-package/bin/python local-engine/prepare-unix-bundle.py --package-dir dist/package --os linux --architecture '${{ matrix.arch }}'
          chmod +x dist/package/GalaxyLocalEngine dist/package/yt-dlp dist/package/ffmpeg/bin/ffmpeg dist/package/ffmpeg/bin/ffprobe
          dist/package/GalaxyLocalEngine --self-test
          dist/package/yt-dlp --version
          dist/package/ffmpeg/bin/ffmpeg -version | head -n 1
          dist/package/ffmpeg/bin/ffprobe -version | head -n 1
          tar -C dist/package -czf 'dist/${{ matrix.artifact }}.tar.gz' .
          shasum -a 256 'dist/${{ matrix.artifact }}.tar.gz' > 'dist/${{ matrix.artifact }}.sha256'

      - name: Validate assembled Linux portable tray
        if: matrix.os_name == 'linux'
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: >-
          timeout 35s
          dbus-run-session --
          xvfb-run -a
          .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py
          dist/package/GalaxyLocalEngine

      - name: Build macOS application bundle
        if: matrix.os_name == 'darwin'
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --add-data 'local-engine/VERSION:.'
          local-engine/entrypoint.py

      - name: Assemble macOS package and verified tools
        if: matrix.os_name == 'darwin'
        run: |
          set -euo pipefail
          test -d dist/GalaxyLocalEngine.app
          MACOS_DIR='dist/GalaxyLocalEngine.app/Contents/MacOS'
          python local-engine/prepare-unix-bundle.py --package-dir "$MACOS_DIR" --os darwin --architecture '${{ matrix.arch }}'
          chmod +x "$MACOS_DIR/GalaxyLocalEngine" "$MACOS_DIR/yt-dlp" "$MACOS_DIR/ffmpeg/bin/ffmpeg" "$MACOS_DIR/ffmpeg/bin/ffprobe"
          "$MACOS_DIR/GalaxyLocalEngine" --self-test
          "$MACOS_DIR/yt-dlp" --version
          "$MACOS_DIR/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$MACOS_DIR/ffmpeg/bin/ffprobe" -version | head -n 1
          mkdir -p dist/package
          mv dist/GalaxyLocalEngine.app dist/package/GalaxyLocalEngine.app
          cp local-engine/README.md dist/package/README.md
          cp 'local-engine/使用说明.txt' 'dist/package/使用说明.txt'
          cp local-engine/VERSION dist/package/VERSION
          ditto -c -k --sequesterRsrc --keepParent dist/package 'dist/${{ matrix.artifact }}.zip'
          shasum -a 256 'dist/${{ matrix.artifact }}.zip' > 'dist/${{ matrix.artifact }}.sha256'

      - name: Upload portable package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 30
