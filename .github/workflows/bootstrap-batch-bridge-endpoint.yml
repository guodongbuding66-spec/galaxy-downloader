name: Bootstrap Batch Bridge Endpoint

on:
  push:
    branches:
      - feature/local-engine-batch-bridge-endpoint
    paths:
      - '.github/workflows/bootstrap-batch-bridge-endpoint.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/local-engine-batch-bridge-endpoint

      - name: Apply batch bridge integration
        run: python scripts/integrate-batch-bridge-endpoint.py

      - name: Compile batch bridge and resume bridge
        run: |
          python -m py_compile \
            local-engine/batch_bridge.py \
            local-engine/batch_input.py \
            local-engine/batch_submission.py \
            local-engine/resume_bridge.py \
            local-engine/job_queue.py \
            local-engine/entrypoint.py

      - name: Run batch bridge contracts
        run: |
          python scripts/test-local-batch-bridge.py
          python scripts/test-local-bridge-submission.py
          python scripts/test-local-job-queue.py
          python scripts/test-local-pause-resume.py
          python scripts/test-local-desktop-hooks.py

      - name: Commit permanent integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/resume_bridge.py scripts/test-local-bridge-submission.py
          git commit -m 'feat(local-engine): expose batch downloads on the v5 bridge'
          git push origin HEAD:feature/local-engine-batch-bridge-endpoint
