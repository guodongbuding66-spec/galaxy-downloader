name: Music Player UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/web-dashboard/music-player.js'
      - 'local-engine/web-dashboard/music-player.css'
      - 'local-engine/headless_web_dashboard.py'
      - 'local-engine/test_headless_music_player_ui.py'
      - '.github/workflows/music-player-ui.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/web-dashboard/music-player.js'
      - 'local-engine/web-dashboard/music-player.css'
      - 'local-engine/headless_web_dashboard.py'
      - 'local-engine/test_headless_music_player_ui.py'
      - '.github/workflows/music-player-ui.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Check JavaScript syntax
        run: node --check local-engine/web-dashboard/music-player.js

      - name: Compile Dashboard contract
        run: python -m py_compile local-engine/headless_web_dashboard.py local-engine/test_headless_music_player_ui.py

      - name: Run Music Player UI tests
        run: python local-engine/test_headless_music_player_ui.py
