name: Bootstrap Pause Resume Queue Restore

on:
  push:
    branches:
      - feat/local-engine-0.15-pause-resume
    paths:
      - '.github/workflows/bootstrap-pause-resume-queue-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/local-engine-0.15-pause-resume

      - name: Apply queue restore fix
        run: python scripts/bootstrap_pause_resume_queue_restore.py

      - name: Compile policies
        run: python -m py_compile local-engine/pause_resume_policy.py scripts/test-local-pause-resume.py

      - name: Run lifecycle regression tests
        run: python scripts/test-local-pause-resume.py

      - name: Run embedded packaged lifecycle self-test
        shell: python
        run: |
          import importlib.util
          import sys
          from pathlib import Path
          path = Path('local-engine/pause_resume_policy.py')
          spec = importlib.util.spec_from_file_location('pause_resume_queue_restore', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['pause_resume_queue_restore'] = module
          spec.loader.exec_module(module)
          module.run_pause_resume_self_test()

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/pause_resume_policy.py scripts/test-local-pause-resume.py
          git commit -m 'fix(local-engine): restore queue state after paused job is discarded'
          git push origin HEAD:feat/local-engine-0.15-pause-resume
