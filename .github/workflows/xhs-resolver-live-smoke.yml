name: XHS Resolver Live Smoke

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'deploy/xhs-resolver/**'
      - 'scripts/xhs-resolver-live-smoke.py'
      - 'tests/test_xhs_resolver_live_smoke.py'
      - '.github/workflows/xhs-resolver-live-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: xhs-resolver-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      XHS_RESOLVER_URL: ${{ secrets.XHS_RESOLVER_URL }}
      XHS_RESOLVER_TOKEN: ${{ secrets.XHS_RESOLVER_TOKEN }}
      XHS_SMOKE_URL: ${{ secrets.XHS_SMOKE_URL }}
      XHS_MEDIA_HOST_SUFFIXES: xhscdn.com,xiaohongshu.com
      XHS_SMOKE_TIMEOUT: '30'
      XHS_SMOKE_FETCH_MEDIA: '1'
      XHS_SMOKE_ALLOW_MISSING: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Docker Compose configuration
        run: |
          XHS_RESOLVER_DOMAIN=xhs-resolver.example.com \
          XHS_RESOLVER_TOKEN=ci-validation-token \
          docker compose \
            -f deploy/xhs-resolver/compose.yaml \
            config \
            > /tmp/xhs-resolver-compose.yaml

      - name: Validate Caddy gateway configuration
        run: |
          docker run --rm \
            -e XHS_RESOLVER_DOMAIN=xhs-resolver.example.com \
            -e XHS_RESOLVER_TOKEN=ci-validation-token \
            -v "${{ github.workspace }}/deploy/xhs-resolver/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run local XHS smoke integration fixtures
        env:
          XHS_RESOLVER_URL: ''
          XHS_RESOLVER_TOKEN: ''
          XHS_SMOKE_URL: ''
          XHS_SMOKE_FETCH_MEDIA: ''
          XHS_SMOKE_ALLOW_MISSING: ''
        run: python -m unittest -v tests.test_xhs_resolver_live_smoke

      - name: Run XHS resolver live smoke
        run: python scripts/xhs-resolver-live-smoke.py

      - name: Print smoke report
        if: always()
        run: cat platform-smoke-artifacts/xhs-resolver-live-smoke.json 2>/dev/null || true

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xhs-resolver-live-smoke
          path: platform-smoke-artifacts/xhs-resolver-live-smoke.json
          if-no-files-found: warn
          retention-days: 30
