name: Container Live Smoke

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'container-backend/**'
      - 'scripts/container-live-smoke.py'
      - 'scripts/platform-smoke.py'
      - '.github/workflows/container-live-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: container-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixture discovery dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'yt-dlp==2026.8.19'

      - name: Build production backend image
        working-directory: container-backend
        run: docker build --pull -t galaxy-downloader-backend:live-smoke .

      - name: Start production backend image
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          YTDLP_RUMBLE_PROXY: ${{ secrets.YTDLP_RUMBLE_PROXY }}
          YTDLP_USER_AGENT: ${{ secrets.YTDLP_USER_AGENT }}
        run: |
          docker run -d \
            --name galaxy-downloader-live-smoke \
            -p 8080:8080 \
            -e YTDLP_COOKIES_B64="$YTDLP_COOKIES_B64" \
            -e YTDLP_PROXY="$YTDLP_PROXY" \
            -e YTDLP_RUMBLE_PROXY="$YTDLP_RUMBLE_PROXY" \
            -e YTDLP_USER_AGENT="$YTDLP_USER_AGENT" \
            -e YTDLP_COOKIE_POLICY=when_needed \
            -e YTDLP_IMPERSONATE=chrome \
            -e YTDLP_SOCKET_TIMEOUT=30 \
            -e YTDLP_EXTRACTOR_RETRIES=3 \
            -e YTDLP_RETRIES=3 \
            -e YTDLP_FRAGMENT_RETRIES=3 \
            -e YTDLP_CONCURRENT_FRAGMENTS=4 \
            galaxy-downloader-backend:live-smoke

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health > /tmp/galaxy-health.json; then
              cat /tmp/galaxy-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs galaxy-downloader-live-smoke
          exit 1

      - name: Verify YouTube challenge runtime
        run: |
          docker exec galaxy-downloader-live-smoke python - <<'PY'
          import importlib.metadata
          import socket

          assert importlib.metadata.version('bgutil-ytdlp-pot-provider') == '1.3.2'
          with socket.create_connection(('127.0.0.1', 4416), timeout=2):
              pass
          print('bgutil provider plugin and TCP service are ready')
          PY

          docker exec galaxy-downloader-live-smoke sh -lc '
            set +e
            /opt/venv/bin/yt-dlp --verbose --simulate --skip-download \
              "https://www.youtube.com/watch?v=BaW_jenozKc" \
              >/tmp/youtube-runtime-diagnostic.log 2>&1
            status=$?
            set -e
            tail -n 120 /tmp/youtube-runtime-diagnostic.log || true
            grep -q "System config.*yt-dlp.conf" /tmp/youtube-runtime-diagnostic.log
            grep -q "youtubepot-bgutilhttp" /tmp/youtube-runtime-diagnostic.log
            grep -Eq "player[_-]client.*mweb|mweb.*player[_-]client" /tmp/youtube-runtime-diagnostic.log
            echo "yt-dlp loaded the bundled PO-token and mweb configuration (probe exit=$status)"
          '

      - name: Run real platform regressions
        env:
          GALAXY_SMOKE_CONTAINER: galaxy-downloader-live-smoke
          GALAXY_SMOKE_LOCAL_API_BASE: http://127.0.0.1:8080
          GALAXY_SMOKE_TIMEOUT: '110'
          GALAXY_SMOKE_MAX_CANDIDATES: '4'
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          YTDLP_RUMBLE_PROXY: ${{ secrets.YTDLP_RUMBLE_PROXY }}
          YTDLP_IMPERSONATE: chrome
        run: python scripts/container-live-smoke.py

      - name: Print backend logs
        if: always()
        run: docker logs galaxy-downloader-live-smoke 2>/dev/null || true

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-live-smoke
          path: |
            platform-smoke-artifacts/container-live-smoke.json
            platform-smoke-artifacts/container-live-smoke.md
          if-no-files-found: warn
          retention-days: 30

      - name: Stop backend container
        if: always()
        run: docker rm -f galaxy-downloader-live-smoke 2>/dev/null || true
