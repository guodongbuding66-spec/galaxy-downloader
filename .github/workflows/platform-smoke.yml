name: Platform 33 Release Gate

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/platform-smoke.py'
      - 'scripts/platform-release-gate.py'
      - 'scripts/platform-browser-fallback-smoke.py'
      - '.github/workflows/platform-smoke.yml'
      - 'src/components/downloader/platform-support.ts'
  pull_request:
    paths:
      - 'scripts/platform-smoke.py'
      - 'scripts/platform-release-gate.py'
      - 'scripts/platform-browser-fallback-smoke.py'
      - '.github/workflows/platform-smoke.yml'
      - 'src/components/downloader/platform-support.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: platform-33-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixture discovery dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp

      - name: Require 33 of 33 live platform downloads
        env:
          PLATFORM_SMOKE_FIXTURES_JSON: ${{ secrets.PLATFORM_SMOKE_FIXTURES_JSON }}
        run: >-
          python scripts/platform-release-gate.py
          --api-base https://downloader-api.bhwa233.com
          --workers 2
          --timeout 30
          --output-dir platform-smoke-artifacts

      - name: Probe browser fallback route
        if: always()
        env:
          PLATFORM_SMOKE_API_BASE: https://downloader-api.bhwa233.com
          PLATFORM_SMOKE_TIMEOUT: '30'
          PLATFORM_SMOKE_FIXTURES_JSON: ${{ secrets.PLATFORM_SMOKE_FIXTURES_JSON }}
        run: python scripts/platform-browser-fallback-smoke.py

      - name: Print report
        if: always()
        run: |
          cat platform-smoke-artifacts/platform-smoke.md || true
          echo
          cat platform-smoke-artifacts/platform-release-gate.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-33-release-gate-report
          path: platform-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 30
