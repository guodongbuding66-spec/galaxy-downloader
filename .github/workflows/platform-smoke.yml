name: Platform Smoke

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'scripts/platform-smoke.py'
      - '.github/workflows/platform-smoke.yml'
      - 'src/components/downloader/platform-support.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixture discovery dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp

      - name: Probe production parser and downloads
        env:
          PLATFORM_SMOKE_API_BASE: https://downloader-api.bhwa233.com
          PLATFORM_SMOKE_WORKERS: '4'
          PLATFORM_SMOKE_TIMEOUT: '30'
          PLATFORM_SMOKE_FIXTURES_JSON: ${{ secrets.PLATFORM_SMOKE_FIXTURES_JSON }}
        run: python scripts/platform-smoke.py --output-dir platform-smoke-artifacts

      - name: Print report
        if: always()
        run: cat platform-smoke-artifacts/platform-smoke.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-report
          path: platform-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 30
