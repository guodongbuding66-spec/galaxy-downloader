name: Desktop ASR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/desktop_asr.py'
      - 'local-engine/headless_qwen3_asr_api.py'
      - 'local-engine/headless_parakeet_asr_api.py'
      - 'scripts/test-local-desktop-asr.py'
      - '.github/workflows/desktop-asr.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/desktop_asr.py'
      - 'local-engine/headless_qwen3_asr_api.py'
      - 'local-engine/headless_parakeet_asr_api.py'
      - 'scripts/test-local-desktop-asr.py'
      - '.github/workflows/desktop-asr.yml'

permissions:
  contents: read

jobs:
  desktop-asr:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r local-engine/requirements.txt
      - run: python -m py_compile local-engine/desktop_asr.py local-engine/headless_qwen3_asr_api.py local-engine/headless_parakeet_asr_api.py scripts/test-local-desktop-asr.py
      - run: python scripts/test-local-desktop-asr.py
