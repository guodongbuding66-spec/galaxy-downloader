name: Local Engine macOS Hotkey

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/desktop_hotkey.py'
      - 'local-engine/desktop_platform_features.py'
      - 'local-engine/test_macos_hotkey_runtime.py'
      - 'local-engine/requirements.txt'
      - '.github/workflows/local-engine-macos-hotkey.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/desktop_hotkey.py'
      - 'local-engine/desktop_platform_features.py'
      - 'local-engine/test_macos_hotkey_runtime.py'
      - 'local-engine/requirements.txt'
      - '.github/workflows/local-engine-macos-hotkey.yml'

permissions:
  contents: read

jobs:
  native-hotkey:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel hotkey
            runner: macos-15-intel
          - label: macOS Apple Silicon hotkey
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Local Engine dependencies
        run: python -m pip install -r local-engine/requirements.txt

      - name: Validate hotkey contract and Carbon API
        run: |
          python -m py_compile local-engine/desktop_hotkey.py local-engine/test_macos_hotkey_runtime.py
          python local-engine/entrypoint.py --self-test

      - name: Exercise native Carbon + Tk lifecycle
        run: python local-engine/test_macos_hotkey_runtime.py
