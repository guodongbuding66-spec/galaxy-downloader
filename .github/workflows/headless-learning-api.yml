name: Headless Learning API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_api.py'
      - 'local-engine/headless_learning_api.py'
      - 'local-engine/headless_learning_structure.py'
      - 'local-engine/headless_course_providers_http.py'
      - 'local-engine/headless_browser_cookies.py'
      - 'local-engine/headless_output_tracking.py'
      - 'local-engine/headless_course_metadata_tracking.py'
      - 'local-engine/headless_service.py'
      - 'local-engine/course_providers.py'
      - 'local-engine/managed_course_download.py'
      - 'local-engine/desktop_course_download.py'
      - 'local-engine/course_download_sessions.py'
      - 'local-engine/course_download_coordinator.py'
      - 'local-engine/course_structure.py'
      - 'local-engine/course_workspace.py'
      - 'local-engine/spaced_repetition.py'
      - 'local-engine/media_library.py'
      - 'local-engine/test_course_providers.py'
      - 'local-engine/test_managed_course_download.py'
      - 'local-engine/test_desktop_course_download.py'
      - 'local-engine/test_course_download_sessions.py'
      - 'local-engine/test_course_download_coordinator.py'
      - 'local-engine/test_course_structure.py'
      - 'local-engine/test_course_metadata_sync.py'
      - 'local-engine/test_headless_learning_structure.py'
      - 'local-engine/test_headless_course_metadata_tracking.py'
      - 'local-engine/test_headless_course_providers_http.py'
      - 'local-engine/test_headless_browser_cookies.py'
      - 'local-engine/test_headless_output_tracking.py'
      - 'scripts/test-local-headless-learning-api.py'
      - '.github/workflows/headless-learning-api.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_api.py'
      - 'local-engine/headless_learning_api.py'
      - 'local-engine/headless_learning_structure.py'
      - 'local-engine/headless_course_providers_http.py'
      - 'local-engine/headless_browser_cookies.py'
      - 'local-engine/headless_output_tracking.py'
      - 'local-engine/headless_course_metadata_tracking.py'
      - 'local-engine/headless_service.py'
      - 'local-engine/course_providers.py'
      - 'local-engine/managed_course_download.py'
      - 'local-engine/desktop_course_download.py'
      - 'local-engine/course_download_sessions.py'
      - 'local-engine/course_download_coordinator.py'
      - 'local-engine/course_structure.py'
      - 'local-engine/course_workspace.py'
      - 'local-engine/spaced_repetition.py'
      - 'local-engine/media_library.py'
      - 'local-engine/test_course_providers.py'
      - 'local-engine/test_managed_course_download.py'
      - 'local-engine/test_desktop_course_download.py'
      - 'local-engine/test_course_download_sessions.py'
      - 'local-engine/test_course_download_coordinator.py'
      - 'local-engine/test_course_structure.py'
      - 'local-engine/test_course_metadata_sync.py'
      - 'local-engine/test_headless_learning_structure.py'
      - 'local-engine/test_headless_course_metadata_tracking.py'
      - 'local-engine/test_headless_course_providers_http.py'
      - 'local-engine/test_headless_browser_cookies.py'
      - 'local-engine/test_headless_output_tracking.py'
      - 'scripts/test-local-headless-learning-api.py'
      - '.github/workflows/headless-learning-api.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile contract
        run: python -m py_compile local-engine/headless_api.py local-engine/headless_learning_api.py local-engine/headless_learning_structure.py local-engine/headless_course_providers_http.py local-engine/headless_browser_cookies.py local-engine/headless_output_tracking.py local-engine/headless_course_metadata_tracking.py local-engine/course_providers.py local-engine/managed_course_download.py local-engine/desktop_course_download.py local-engine/course_download_sessions.py local-engine/course_download_coordinator.py local-engine/course_structure.py local-engine/test_course_providers.py local-engine/test_managed_course_download.py local-engine/test_desktop_course_download.py local-engine/test_course_download_sessions.py local-engine/test_course_download_coordinator.py local-engine/test_course_structure.py local-engine/test_course_metadata_sync.py local-engine/test_headless_learning_structure.py local-engine/test_headless_course_metadata_tracking.py local-engine/test_headless_course_providers_http.py local-engine/test_headless_browser_cookies.py local-engine/test_headless_output_tracking.py scripts/test-local-headless-learning-api.py

      - name: Run course provider unit tests
        run: |
          python local-engine/test_course_providers.py
          python local-engine/test_managed_course_download.py
          python local-engine/test_desktop_course_download.py
          python local-engine/test_course_download_sessions.py
          python local-engine/test_course_download_coordinator.py
          python local-engine/test_course_structure.py
          python local-engine/test_course_metadata_sync.py
          python local-engine/test_headless_learning_structure.py
          python local-engine/test_headless_course_metadata_tracking.py
          python local-engine/test_headless_course_providers_http.py
          python local-engine/test_headless_browser_cookies.py
          python local-engine/test_headless_output_tracking.py

      - name: Run headless Learning API self-test
        run: python scripts/test-local-headless-learning-api.py
