name: Twitch Clip Smoke

on:
  push:
    branches:
      - 'feature/platform-download-health'
    paths:
      - 'scripts/twitch-clip-smoke.py'
      - '.github/workflows/twitch-clip-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/twitch-clip-smoke.py
