name: Local Engine Unix Release Assets

on:
  workflow_run:
    workflows:
      - Local Engine Release
    types:
      - completed
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/requirements.txt'
      - 'local-engine/prepare-unix-bundle.py'
      - 'local-engine/linux_release.py'
      - 'local-engine/macos_release.py'
      - 'local-engine/platform_paths.py'
      - 'local-engine/desktop_tray.py'
      - 'local-engine/VERSION'
      - 'scripts/test-local-linux-release.py'
      - 'scripts/test-local-macos-release.py'
      - 'scripts/test-local-packaged-linux-tray.py'
      - '.github/workflows/local-engine-unix-release.yml'

permissions:
  contents: write

concurrency:
  group: local-engine-unix-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-unix-release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64 release
            runner: ubuntu-24.04
            os_name: linux
            arch: amd64
            artifact: GalaxyLocalEngine-Linux-x64
            archive: GalaxyLocalEngine-Linux-x64.tar.gz
          - label: Linux arm64 release
            runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            artifact: GalaxyLocalEngine-Linux-arm64
            archive: GalaxyLocalEngine-Linux-arm64.tar.gz
          - label: macOS Intel release
            runner: macos-15-intel
            os_name: darwin
            arch: amd64
            artifact: GalaxyLocalEngine-macOS-x64
            archive: GalaxyLocalEngine-macOS-x64.zip
          - label: macOS Apple Silicon release
            runner: macos-15
            os_name: darwin
            arch: arm64
            artifact: GalaxyLocalEngine-macOS-arm64
            archive: GalaxyLocalEngine-macOS-arm64.zip

    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        if: matrix.os_name == 'darwin'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Local Engine dependencies
        if: matrix.os_name == 'darwin'
        run: python -m pip install -r local-engine/requirements.txt

      - name: Install Linux package and AppIndicator build tools
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            rpm \
            libarchive-tools \
            python3-venv \
            python3-tk \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1 \
            dbus-x11 \
            xvfb \
            xauth
          /usr/bin/python3 -m venv --system-site-packages .venv-linux-package
          .venv-linux-package/bin/python -m pip install -r local-engine/requirements.txt
          .venv-linux-package/bin/python - <<'PY'
          import importlib.util
          import gi
          gi.require_version('Gtk', '3.0')
          gi.require_version('AyatanaAppIndicator3', '0.1')
          from gi.repository import AyatanaAppIndicator3, Gtk
          assert Gtk is not None
          assert AyatanaAppIndicator3 is not None
          assert importlib.util.find_spec('pystray') is not None
          assert importlib.util.find_spec('PIL') is not None
          assert importlib.util.find_spec('tkinter') is not None
          print('Linux GI/AppIndicator/Tk build dependencies OK')
          PY

      - name: Validate release source and bundle policy
        run: |
          set -euo pipefail
          if [ '${{ matrix.os_name }}' = 'linux' ]; then
            PYTHON='.venv-linux-package/bin/python'
          else
            PYTHON='python'
          fi
          "$PYTHON" -m py_compile local-engine/prepare-unix-bundle.py scripts/test-local-unix-bundle.py
          "$PYTHON" scripts/test-local-unix-bundle.py
          "$PYTHON" local-engine/prepare-unix-bundle.py --package-dir unused --os '${{ matrix.os_name }}' --architecture '${{ matrix.arch }}' --print-plan
          "$PYTHON" local-engine/entrypoint.py --self-test

      - name: Validate Linux desktop package contract
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          .venv-linux-package/bin/python -m py_compile local-engine/linux_release.py scripts/test-local-linux-release.py scripts/test-local-packaged-linux-tray.py
          .venv-linux-package/bin/python scripts/test-local-linux-release.py
          .venv-linux-package/bin/python local-engine/linux_release.py --package-dir unused --architecture '${{ matrix.arch }}' --print-plan

      - name: Validate macOS DMG package contract
        if: matrix.os_name == 'darwin'
        run: |
          set -euo pipefail
          python -m py_compile local-engine/macos_release.py scripts/test-local-macos-release.py
          python scripts/test-local-macos-release.py
          python local-engine/macos_release.py --output-dir dist --architecture '${{ matrix.arch }}' --print-plan
          command -v ditto
          command -v hdiutil

      - name: Build Linux portable executable
        if: matrix.os_name == 'linux'
        run: >-
          .venv-linux-package/bin/pyinstaller
          --noconfirm
          --clean
          --onefile
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --hidden-import pystray._appindicator
          --hidden-import gi
          --hidden-import gi.repository.Gtk
          --hidden-import gi.repository.AyatanaAppIndicator3
          --add-data 'local-engine/VERSION:.'
          local-engine/entrypoint.py

      - name: Validate frozen Linux AppIndicator runtime
        if: matrix.os_name == 'linux'
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: >-
          timeout 35s
          dbus-run-session --
          xvfb-run -a
          .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py
          dist/GalaxyLocalEngine
          --port 18736

      - name: Assemble Linux release package
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp dist/GalaxyLocalEngine dist/package/GalaxyLocalEngine
          cp local-engine/README.md dist/package/README.md
          cp 'local-engine/使用说明.txt' 'dist/package/使用说明.txt'
          cp local-engine/VERSION dist/package/VERSION
          .venv-linux-package/bin/python local-engine/prepare-unix-bundle.py --package-dir dist/package --os linux --architecture '${{ matrix.arch }}'
          chmod +x dist/package/GalaxyLocalEngine dist/package/yt-dlp dist/package/ffmpeg/bin/ffmpeg dist/package/ffmpeg/bin/ffprobe
          dist/package/GalaxyLocalEngine --self-test
          dist/package/yt-dlp --version
          dist/package/ffmpeg/bin/ffmpeg -version | head -n 1
          dist/package/ffmpeg/bin/ffprobe -version | head -n 1
          tar -C dist/package -czf 'dist/${{ matrix.archive }}' .
          sha256sum 'dist/${{ matrix.archive }}' > 'dist/${{ matrix.archive }}.sha256'

      - name: Validate assembled Linux portable tray
        if: matrix.os_name == 'linux'
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: >-
          timeout 35s
          dbus-run-session --
          xvfb-run -a
          .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py
          dist/package/GalaxyLocalEngine
          --port 18737

      - name: Build AppImage DEB and RPM
        if: matrix.os_name == 'linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .venv-linux-package/bin/python local-engine/linux_release.py
          --package-dir dist/package
          --output-dir dist
          --architecture '${{ matrix.arch }}'

      - name: Smoke test Linux desktop packages
        if: matrix.os_name == 'linux'
        env:
          PYSTRAY_BACKEND: appindicator
          GDK_BACKEND: x11
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          prefix='dist/${{ matrix.artifact }}'

          test -x "$prefix.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$prefix.AppImage" --self-test
          timeout 35s dbus-run-session -- xvfb-run -a \
            .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py "$prefix.AppImage" --port 18738
          (
            cd dist
            rm -rf squashfs-root
            './${{ matrix.artifact }}.AppImage' --appimage-extract >/dev/null
            desktop-file-validate 'squashfs-root/galaxy-local-engine.desktop'
            test -x 'squashfs-root/AppRun'
            'squashfs-root/AppRun' --self-test
          )

          rm -rf dist/deb-root
          mkdir -p dist/deb-root
          dpkg-deb --info "$prefix.deb" >/dev/null
          dpkg-deb --extract "$prefix.deb" dist/deb-root
          desktop-file-validate dist/deb-root/usr/share/applications/galaxy-local-engine.desktop
          grep -F 'MimeType=x-scheme-handler/galaxy-downloader;' dist/deb-root/usr/share/applications/galaxy-local-engine.desktop
          test -x dist/deb-root/usr/bin/galaxy-local-engine
          dist/deb-root/opt/galaxy-local-engine/GalaxyLocalEngine --self-test
          timeout 35s dbus-run-session -- xvfb-run -a \
            .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py \
            dist/deb-root/opt/galaxy-local-engine/GalaxyLocalEngine --port 18739

          rm -rf dist/rpm-root
          mkdir -p dist/rpm-root
          rpm -qip "$prefix.rpm" >/dev/null
          rpm -qlp "$prefix.rpm" | grep -Fx '/usr/bin/galaxy-local-engine'
          bsdtar -tf "$prefix.rpm" >/dev/null
          bsdtar -xf "$prefix.rpm" -C dist/rpm-root
          desktop-file-validate dist/rpm-root/usr/share/applications/galaxy-local-engine.desktop
          grep -F 'MimeType=x-scheme-handler/galaxy-downloader;' dist/rpm-root/usr/share/applications/galaxy-local-engine.desktop
          test -x dist/rpm-root/usr/bin/galaxy-local-engine
          dist/rpm-root/opt/galaxy-local-engine/GalaxyLocalEngine --self-test
          timeout 35s dbus-run-session -- xvfb-run -a \
            .venv-linux-package/bin/python scripts/test-local-packaged-linux-tray.py \
            dist/rpm-root/opt/galaxy-local-engine/GalaxyLocalEngine --port 18740

          for package in "$prefix.AppImage" "$prefix.deb" "$prefix.rpm"; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Build macOS application bundle
        if: matrix.os_name == 'darwin'
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name GalaxyLocalEngine
          --collect-all yt_dlp
          --add-data 'local-engine/VERSION:.'
          local-engine/entrypoint.py

      - name: Assemble macOS release package
        if: matrix.os_name == 'darwin'
        run: |
          set -euo pipefail
          test -d dist/GalaxyLocalEngine.app
          MACOS_DIR='dist/GalaxyLocalEngine.app/Contents/MacOS'
          python local-engine/prepare-unix-bundle.py --package-dir "$MACOS_DIR" --os darwin --architecture '${{ matrix.arch }}'
          printf '1\n' > "$MACOS_DIR/installed.flag"
          chmod +x "$MACOS_DIR/GalaxyLocalEngine" "$MACOS_DIR/yt-dlp" "$MACOS_DIR/ffmpeg/bin/ffmpeg" "$MACOS_DIR/ffmpeg/bin/ffprobe"
          TEST_HOME="$RUNNER_TEMP/galaxy-macos-home-${{ matrix.arch }}"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" "$MACOS_DIR/GalaxyLocalEngine" --self-test
          "$MACOS_DIR/yt-dlp" --version
          "$MACOS_DIR/ffmpeg/bin/ffmpeg" -version | head -n 1
          "$MACOS_DIR/ffmpeg/bin/ffprobe" -version | head -n 1
          mkdir -p dist/package
          mv dist/GalaxyLocalEngine.app dist/package/GalaxyLocalEngine.app
          cp local-engine/README.md dist/package/README.md
          cp 'local-engine/使用说明.txt' dist/package/使用说明.txt
          cp local-engine/VERSION dist/package/VERSION
          ditto -c -k --sequesterRsrc --keepParent dist/package 'dist/${{ matrix.archive }}'
          shasum -a 256 'dist/${{ matrix.archive }}' > 'dist/${{ matrix.archive }}.sha256'

      - name: Build and smoke test macOS DMG
        if: matrix.os_name == 'darwin'
        run: |
          set -euo pipefail
          DMG='dist/${{ matrix.artifact }}.dmg'
          python local-engine/macos_release.py \
            --app dist/package/GalaxyLocalEngine.app \
            --output-dir dist \
            --architecture '${{ matrix.arch }}'
          test -f "$DMG"
          hdiutil verify "$DMG"

          MOUNT="$RUNNER_TEMP/galaxy-dmg-${{ matrix.arch }}"
          DMG_HOME="$RUNNER_TEMP/galaxy-dmg-home-${{ matrix.arch }}"
          rm -rf "$MOUNT" "$DMG_HOME"
          mkdir -p "$MOUNT" "$DMG_HOME"
          cleanup_dmg() {
            hdiutil detach "$MOUNT" >/dev/null 2>&1 || hdiutil detach -force "$MOUNT" >/dev/null 2>&1 || true
          }
          trap cleanup_dmg EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT" >/dev/null
          test -d "$MOUNT/GalaxyLocalEngine.app"
          test -L "$MOUNT/Applications"
          test "$(readlink "$MOUNT/Applications")" = '/Applications'
          test -f "$MOUNT/GalaxyLocalEngine.app/Contents/MacOS/installed.flag"
          HOME="$DMG_HOME" "$MOUNT/GalaxyLocalEngine.app/Contents/MacOS/GalaxyLocalEngine" --self-test
          cleanup_dmg
          trap - EXIT
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload Unix release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 30

  publish-unix-assets:
    if: github.event_name != 'pull_request'
    needs: build-unix-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify matching Local Engine release
        id: release
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < local-engine/VERSION)"
          case "$version" in
            ''|*[!0-9.]*|.*|*.) echo "Invalid local-engine/VERSION: $version" >&2; exit 1 ;;
          esac
          tag="local-engine-v$version"
          gh release view "$tag" --json tagName >/dev/null
          git fetch --tags --force
          tag_sha="$(git rev-list -n 1 "$tag")"
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "Release $tag points to $tag_sha but Unix assets were built from $SOURCE_SHA" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download current Unix build artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/collected dist/publish
          gh run download "$GITHUB_RUN_ID" \
            --name GalaxyLocalEngine-Linux-x64 \
            --name GalaxyLocalEngine-Linux-arm64 \
            --name GalaxyLocalEngine-macOS-x64 \
            --name GalaxyLocalEngine-macOS-arm64 \
            --dir dist/collected
          find dist/collected -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -exec cp '{}' dist/publish/ \;

      - name: Download existing Windows release asset
        run: |
          set -euo pipefail
          gh release download '${{ steps.release.outputs.tag }}' \
            --pattern 'GalaxyLocalEngine-Windows.zip' \
            --dir dist/publish

      - name: Validate complete release asset set and write SHA-256
        run: |
          set -euo pipefail
          expected=(
            GalaxyLocalEngine-Windows.zip
            GalaxyLocalEngine-Linux-x64.tar.gz
            GalaxyLocalEngine-Linux-x64.AppImage
            GalaxyLocalEngine-Linux-x64.deb
            GalaxyLocalEngine-Linux-x64.rpm
            GalaxyLocalEngine-Linux-arm64.tar.gz
            GalaxyLocalEngine-Linux-arm64.AppImage
            GalaxyLocalEngine-Linux-arm64.deb
            GalaxyLocalEngine-Linux-arm64.rpm
            GalaxyLocalEngine-macOS-x64.zip
            GalaxyLocalEngine-macOS-x64.dmg
            GalaxyLocalEngine-macOS-arm64.zip
            GalaxyLocalEngine-macOS-arm64.dmg
          )
          for file in "${expected[@]}"; do
            test -f "dist/publish/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
          (
            cd dist/publish
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )
          cat dist/publish/SHA256SUMS.txt

      - name: Attach Unix assets and unified checksum manifest
        run: |
          set -euo pipefail
          gh release upload '${{ steps.release.outputs.tag }}' \
            dist/publish/GalaxyLocalEngine-Linux-x64.tar.gz \
            dist/publish/GalaxyLocalEngine-Linux-x64.AppImage \
            dist/publish/GalaxyLocalEngine-Linux-x64.deb \
            dist/publish/GalaxyLocalEngine-Linux-x64.rpm \
            dist/publish/GalaxyLocalEngine-Linux-arm64.tar.gz \
            dist/publish/GalaxyLocalEngine-Linux-arm64.AppImage \
            dist/publish/GalaxyLocalEngine-Linux-arm64.deb \
            dist/publish/GalaxyLocalEngine-Linux-arm64.rpm \
            dist/publish/GalaxyLocalEngine-macOS-x64.zip \
            dist/publish/GalaxyLocalEngine-macOS-x64.dmg \
            dist/publish/GalaxyLocalEngine-macOS-arm64.zip \
            dist/publish/GalaxyLocalEngine-macOS-arm64.dmg \
            dist/publish/SHA256SUMS.txt \
            --clobber