name: Apply V1.1 shared output plan patch

on:
  push:
    branches:
      - feat/local-engine-shared-output-plan
    paths:
      - '.github/workflows/v11-apply-shared-plan.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-engine-shared-output-plan
          fetch-depth: 0

      - name: Patch AdvancedDownloadOptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/downloader/AdvancedDownloadOptions.tsx')
          text = path.read_text(encoding='utf-8')

          import_marker = "import { formatBytes, sanitizeFilename } from '@/lib/utils';\n"
          import_line = "import { LocalEngineDownloadCard } from './LocalEngineDownloadCard';\n"
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit('import marker not found')
              text = text.replace(import_marker, import_marker + "\n" + import_line, 1)

          plan_marker = "    const selectedAudioLabel = AUDIO_QUALITY_PRESETS.find((item) => item.quality === audioQuality)?.label || audioQuality;\n"
          plan_block = """    const localEnginePlan = {\n        videoSelection: effectiveVideoQuality\n            ? {\n                quality: effectiveVideoQuality.quality,\n                label: effectiveVideoQuality.label,\n                height: effectiveVideoQuality.height,\n            }\n            : null,\n        audioQuality,\n        includeAudio,\n        includeSubtitle: includeSubtitle && Boolean(selectedSubtitle),\n        subtitleLanguage: selectedSubtitle?.language || null,\n        includeCover: includeCover && Boolean(capabilities.cover),\n    };\n"""
          if plan_block not in text:
              if plan_marker not in text:
                  raise SystemExit('plan marker not found')
              text = text.replace(plan_marker, plan_marker + "\n" + plan_block, 1)

          card_marker = """                    </div>\n\n                    {progress && (\n"""
          card_block = """                    </div>\n\n                    <LocalEngineDownloadCard\n                        result={result}\n                        plan={localEnginePlan}\n                        disabled={running}\n                    />\n\n                    {progress && (\n"""
          if '<LocalEngineDownloadCard\n                        result={result}' not in text:
              if card_marker not in text:
                  raise SystemExit('card marker not found')
              text = text.replace(card_marker, card_block, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/downloader/AdvancedDownloadOptions.tsx; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/downloader/AdvancedDownloadOptions.tsx
          git commit -m 'feat: share final output plan with Local Engine'
          git push origin HEAD:feat/local-engine-shared-output-plan
