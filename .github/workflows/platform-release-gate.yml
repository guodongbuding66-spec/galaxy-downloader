name: Platform Release Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/platform-smoke.py'
      - 'scripts/platform_release_gate.py'
      - 'scripts/test-platform-release-gate.py'
      - '.github/workflows/platform-release-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/platform-smoke.py'
      - 'scripts/platform_release_gate.py'
      - 'scripts/test-platform-release-gate.py'
      - '.github/workflows/platform-release-gate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile gate
        run: python -m py_compile scripts/platform-smoke.py scripts/platform_release_gate.py scripts/test-platform-release-gate.py

      - name: Run gate contract tests
        run: python scripts/test-platform-release-gate.py

  production-33-platform-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install production fixture discovery dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir yt-dlp

      - name: Require 33/33 production parse and real media/resource probes
        env:
          PLATFORM_SMOKE_API_BASE: https://downloader-api.bhwa233.com
          PLATFORM_SMOKE_WORKERS: '2'
          PLATFORM_SMOKE_TIMEOUT: '30'
          PLATFORM_SMOKE_FIXTURES_JSON: ${{ secrets.PLATFORM_SMOKE_FIXTURES_JSON }}
        run: python scripts/platform_release_gate.py --output-dir platform-release-gate-artifacts

      - name: Require browser fallback smoke
        env:
          PLATFORM_SMOKE_API_BASE: https://downloader-api.bhwa233.com
          PLATFORM_SMOKE_TIMEOUT: '30'
          PLATFORM_SMOKE_FIXTURES_JSON: ${{ secrets.PLATFORM_SMOKE_FIXTURES_JSON }}
        run: python scripts/platform-browser-fallback-smoke.py

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-release-gate-report
          path: platform-release-gate-artifacts/
          if-no-files-found: error
          retention-days: 90
