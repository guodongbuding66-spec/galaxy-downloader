name: Bootstrap Queue Renderer Hook Convergence

on:
  push:
    branches:
      - refactor/local-engine-queue-render-hooks
    paths:
      - '.github/workflows/bootstrap-queue-render-hooks.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refactor/local-engine-queue-render-hooks

      - name: Apply queue renderer transform
        run: python scripts/refactor-queue-render-hooks.py

      - name: Compile desktop modules
        run: |
          python -m py_compile \
            local-engine/desktop_hooks.py \
            local-engine/desktop_ui.py \
            local-engine/desktop_extras.py

      - name: Run deterministic contracts
        run: |
          python scripts/test-local-desktop-hooks.py
          python scripts/test-local-manager-policy.py
          python scripts/test-local-runtime-policy.py
          python scripts/test-local-recovery-policy.py
          python scripts/test-local-pause-resume.py

      - name: Commit queue renderer convergence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add local-engine/desktop_hooks.py local-engine/desktop_ui.py local-engine/desktop_extras.py scripts/test-local-desktop-hooks.py
          git commit -m 'refactor(local-engine): replace queue renderer takeover with row hooks'
          git push origin HEAD:refactor/local-engine-queue-render-hooks
