name: Bootstrap Web Batch Bridge Client

on:
  push:
    branches:
      - feature/web-batch-bridge-client
    paths:
      - '.github/workflows/bootstrap-web-batch-bridge-client.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feature/web-batch-bridge-client

      - name: Apply web batch bridge client integration
        run: python scripts/integrate-web-batch-bridge-client.py

      - name: Compile Local Engine bridge modules
        run: |
          python -m py_compile \
            local-engine/batch_bridge.py \
            local-engine/batch_input.py \
            local-engine/batch_submission.py \
            local-engine/resume_bridge.py \
            local-engine/job_queue.py

      - name: Run real Local Engine bridge HTTP contracts
        run: python scripts/test-local-bridge-submission.py

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.8.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run targeted web batch bridge tests
        run: >-
          pnpm exec vitest run
          tests/local-engine-batch-bridge-client.test.ts
          tests/local-engine-bridge-error.test.ts

      - name: Run lint
        run: pnpm lint

      - name: Commit permanent integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/local-engine-bridge.ts \
            local-engine/resume_bridge.py \
            scripts/test-local-bridge-submission.py
          git commit -m 'feat(web): add capability-aware Local Engine batch bridge client'
          git push origin HEAD:feature/web-batch-bridge-client
