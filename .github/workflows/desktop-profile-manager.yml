name: Desktop Download Profiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/download_profiles.py'
      - 'local-engine/desktop_profile_manager.py'
      - 'local-engine/entrypoint.py'
      - 'scripts/test-local-download-profiles.py'
      - 'scripts/test-local-desktop-profile-manager.py'
      - '.github/workflows/download-profiles.yml'
      - '.github/workflows/desktop-profile-manager.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/download_profiles.py'
      - 'local-engine/desktop_profile_manager.py'
      - 'local-engine/entrypoint.py'
      - 'scripts/test-local-download-profiles.py'
      - 'scripts/test-local-desktop-profile-manager.py'
      - '.github/workflows/download-profiles.yml'
      - '.github/workflows/desktop-profile-manager.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Desktop Profile contract
        run: python -m py_compile local-engine/download_profiles.py local-engine/desktop_profile_manager.py local-engine/entrypoint.py scripts/test-local-download-profiles.py scripts/test-local-desktop-profile-manager.py

      - name: Run Download Profiles core contract
        run: python scripts/test-local-download-profiles.py

      - name: Run Desktop Profile manager contract
        run: python scripts/test-local-desktop-profile-manager.py
