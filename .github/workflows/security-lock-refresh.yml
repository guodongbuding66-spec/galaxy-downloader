name: Security Lock Refresh

on:
  push:
    branches:
      - fix-js-security-audit-20261006

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[security-lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix-js-security-audit-20261006

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Update patched Next.js dependency set
        run: pnpm up next@16.3.6 eslint-config-next@16.3.6 --save-exact

      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): update patched Next.js dependency set [security-lock-refresh]"
          git push origin HEAD:fix-js-security-audit-20261006
