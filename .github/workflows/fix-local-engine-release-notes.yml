name: Fix Local Engine Release Notes

on:
  push:
    branches:
      - fix/local-engine-release-notes-template
    paths:
      - '.github/workflows/fix-local-engine-release-notes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/local-engine-release-notes-template

      - name: Replace hard-coded release body with notes file
        shell: python
        run: |
          from pathlib import Path

          release = Path('.github/workflows/local-engine-release.yml')
          text = release.read_text(encoding='utf-8')
          start_marker = '          $notes = @"\n'
          end_marker = '          gh release create $env:RELEASE_TAG dist/GalaxyLocalEngine-Windows.zip dist/SHA256SUMS.txt --title "Galaxy Local Engine $env:RELEASE_TAG" --notes $notes --verify-tag'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('release workflow hard-coded notes block did not match exactly once')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '\n'.join([
              '          python scripts/test-local-release-notes.py',
              '          if ($LASTEXITCODE -ne 0) { throw "Release notes contract failed" }',
              '',
              '          gh release create $env:RELEASE_TAG dist/GalaxyLocalEngine-Windows.zip dist/SHA256SUMS.txt --title "Galaxy Local Engine $env:RELEASE_TAG" --notes-file local-engine/RELEASE_NOTES.md --verify-tag',
          ])
          text = text[:start] + replacement + text[end:]

          policy_anchor = '          python scripts/test-local-recovery-policy.py\n'
          if text.count(policy_anchor) != 1:
              raise SystemExit(f'expected one release policy anchor, got {text.count(policy_anchor)}')
          text = text.replace(
              policy_anchor,
              policy_anchor + '          python scripts/test-local-release-notes.py\n',
              1,
          )
          release.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          ci_anchor = '          python3 scripts/test-local-recovery-policy.py\n'
          if ci_text.count(ci_anchor) != 1:
              raise SystemExit(f'expected one CI release-notes anchor, got {ci_text.count(ci_anchor)}')
          ci.write_text(
              ci_text.replace(ci_anchor, ci_anchor + '          python3 scripts/test-local-release-notes.py\n', 1),
              encoding='utf-8',
          )

      - name: Validate release notes contract
        run: python scripts/test-local-release-notes.py

      - name: Repair published 0.15.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit local-engine-v0.15.0 \
            --repo guodongbuding66-spec/galaxy-downloader \
            --title 'Galaxy Local Engine local-engine-v0.15.0' \
            --notes-file local-engine/RELEASE_NOTES.md
          body="$(gh release view local-engine-v0.15.0 --repo guodongbuding66-spec/galaxy-downloader --json body --jq .body)"
          grep -Fq '# Galaxy Local Engine 0.15.0' <<<"$body"
          grep -Fq '## 0.15.0' <<<"$body"
          grep -Fq '暂停当前' <<<"$body"
          grep -Fq 'POST /resume' <<<"$body"

      - name: Remove one-shot workflow and commit permanent fix
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-local-engine-release-notes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/local-engine-release.yml .github/workflows/ci.yml local-engine/RELEASE_NOTES.md scripts/test-local-release-notes.py
          git commit -m 'fix(local-engine): make release notes version-gated'
          git push origin HEAD:fix/local-engine-release-notes-template
