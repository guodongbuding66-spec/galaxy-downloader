name: Headless Parakeet ASR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/headless_parakeet_asr_api.py'
      - 'local-engine/headless_sensevoice_asr_api.py'
      - 'local-engine/headless_asr_api.py'
      - 'local-engine/asr_preferences.py'
      - 'local-engine/asr_provider_router.py'
      - 'local-engine/parakeet_provider.py'
      - 'scripts/test-local-headless-parakeet-asr.py'
      - '.github/workflows/headless-parakeet-asr.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/headless_parakeet_asr_api.py'
      - 'local-engine/headless_sensevoice_asr_api.py'
      - 'local-engine/headless_asr_api.py'
      - 'local-engine/asr_preferences.py'
      - 'local-engine/asr_provider_router.py'
      - 'local-engine/parakeet_provider.py'
      - 'scripts/test-local-headless-parakeet-asr.py'
      - '.github/workflows/headless-parakeet-asr.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile contract
        run: >-
          python -m py_compile
          local-engine/headless_parakeet_asr_api.py
          local-engine/headless_sensevoice_asr_api.py
          local-engine/headless_asr_api.py
          local-engine/asr_preferences.py
          local-engine/asr_provider_router.py
          local-engine/parakeet_provider.py
          scripts/test-local-headless-parakeet-asr.py

      - name: Run Headless Parakeet self-test
        run: python scripts/test-local-headless-parakeet-asr.py
