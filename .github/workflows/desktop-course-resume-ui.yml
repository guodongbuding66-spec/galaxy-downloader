name: Desktop Course Resume UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'local-engine/desktop_learning_navigation.py'
      - 'local-engine/desktop_course_resume.py'
      - 'local-engine/headless_learning_resume.py'
      - 'local-engine/course_resume.py'
      - 'local-engine/test_desktop_learning_resume_ui.py'
      - '.github/workflows/desktop-course-resume-ui.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/desktop_learning_navigation.py'
      - 'local-engine/desktop_course_resume.py'
      - 'local-engine/headless_learning_resume.py'
      - 'local-engine/course_resume.py'
      - 'local-engine/test_desktop_learning_resume_ui.py'
      - '.github/workflows/desktop-course-resume-ui.yml'

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install local engine requirements
        run: python -m pip install -r local-engine/requirements.txt

      - name: Compile Desktop Resume UI contract
        run: python -m py_compile local-engine/desktop_learning_navigation.py local-engine/desktop_course_resume.py local-engine/test_desktop_learning_resume_ui.py

      - name: Run Desktop Resume UI tests
        run: python local-engine/test_desktop_learning_resume_ui.py