name: Apply workbench layout fix

on:
  push:
    branches:
      - fix/workbench-layout-overlap-and-platform-wall
    paths:
      - .github/workflows/apply-workbench-layout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workbench-layout-overlap-and-platform-wall
          fetch-depth: 0

      - name: Apply scoped UI fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count} for {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 1) The finished-output module lives inside a narrow result aside.
          # Never apply viewport-based nested columns inside that constrained width.
          replace(
              'src/components/downloader/AdvancedDownloadOptions.tsx',
              'className="grid gap-5 p-4 sm:p-5 lg:grid-cols-[minmax(0,1.35fr)_minmax(18rem,0.65fr)] lg:items-start"',
              'className="grid gap-5 p-4 sm:p-5"',
          )
          replace(
              'src/components/downloader/AdvancedDownloadOptions.tsx',
              'className="grid gap-4 rounded-xl bg-muted/20 p-4 ring-1 ring-border/70 md:grid-cols-2"',
              'className="grid gap-4 rounded-xl bg-muted/20 p-4 ring-1 ring-border/70"',
          )
          replace(
              'src/components/downloader/AdvancedDownloadOptions.tsx',
              'className="grid gap-2 md:grid-cols-3"',
              'className="grid gap-2"',
          )
          replace(
              'src/components/downloader/AdvancedDownloadOptions.tsx',
              'className="space-y-3 lg:sticky lg:top-20"',
              'className="space-y-3"',
          )
          replace(
              'src/components/downloader/VideoResultPanel.tsx',
              'className="min-w-0 lg:sticky lg:top-20"',
              'className="min-w-0"',
          )

          # 2) Make the existing four-step flow explicitly discoverable as usage instructions.
          copy_replacements = {
              "flowTitle: '一键成品流程'": "flowTitle: '使用说明 · 一键成品流程'",
              "flowTitle: '一鍵成品流程'": "flowTitle: '使用說明 · 一鍵成品流程'",
              "flowTitle: 'One finished-file workflow'": "flowTitle: 'How to use · finished-file workflow'",
              "flowTitle: '完成ファイルまでの流れ'": "flowTitle: '使い方 · 完成ファイルまでの流れ'",
              "flowTitle: 'Flujo de un solo archivo final'": "flowTitle: 'Cómo usarlo · flujo del archivo final'",
              "flowTitle: 'Один процесс — один готовый файл'": "flowTitle: 'Как пользоваться · путь к готовому файлу'",
          }
          p = Path('src/app/[locale]/unified-downloader.tsx')
          text = p.read_text(encoding='utf-8')
          for old, new in copy_replacements.items():
              if old not in text:
                  raise SystemExit(f'unified-downloader.tsx: missing {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Platform wall: responsive full-width cards instead of a narrow two-column list.
          replace(
              'src/components/downloader/PlatformSupportGrid.tsx',
              'className="grid grid-cols-2 gap-x-3 gap-y-1"',
              'className="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"',
          )
          replace(
              'src/components/downloader/PlatformSupportGrid.tsx',
              'className="flex min-w-0 items-center gap-2 rounded-lg px-0.5 py-1"',
              'className="group flex min-w-0 items-center gap-2.5 rounded-xl border border-border/70 bg-background/70 px-3 py-2.5 shadow-sm transition-[border-color,background-color,box-shadow,transform] duration-150 hover:-translate-y-0.5 hover:border-primary/30 hover:bg-primary/[0.025] hover:shadow-md motion-reduce:transform-none"',
          )
          replace(
              'src/components/downloader/PlatformSupportGrid.tsx',
              "'relative flex h-7 w-7 shrink-0 items-center justify-center rounded-md border'",
              "'relative flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border bg-card'",
          )
          replace(
              'src/components/downloader/PlatformSupportGrid.tsx',
              'className="min-w-0 truncate text-[14px] font-semibold leading-4 text-foreground"',
              'className="min-w-0 truncate text-sm font-semibold leading-5 text-foreground"',
          )

          # Give the platform card a className hook and roomier full-width presentation.
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              "import type { Dictionary } from '@/lib/i18n/types';\n",
              "import type { Dictionary } from '@/lib/i18n/types';\nimport { cn } from '@/lib/utils';\n",
          )
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              "interface PlatformGuideCardProps {\n    dict: Pick<Dictionary, 'guide'>;\n}",
              "interface PlatformGuideCardProps {\n    dict: Pick<Dictionary, 'guide'>;\n    className?: string;\n}",
          )
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              'export function PlatformGuideCard({ dict }: PlatformGuideCardProps) {',
              'export function PlatformGuideCard({ dict, className }: PlatformGuideCardProps) {',
          )
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              '<Card>',
              "<Card className={cn('overflow-hidden', className)}>",
          )
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              'className="p-4 pb-3"',
              'className="p-5 pb-3 sm:p-6 sm:pb-4"',
          )
          replace(
              'src/components/downloader/PlatformGuideCard.tsx',
              'className="p-4 pt-0"',
              'className="p-5 pt-0 sm:p-6 sm:pt-0"',
          )

          # Explicit layout groups: 3 helper cards in one row, platform wall in its own full row.
          p = Path('src/app/[locale]/page.tsx')
          text = p.read_text(encoding='utf-8')
          old_left = '''                leftRail={\n                    <>\n                        <TodayStatsCard dict={dict} />\n                        <QuickStartCard dict={dict} />\n                        <FreeSupportCard dict={dict} />\n                        <ViewportSideRailAd slot="1341604736" showOn="desktop" height={250} />\n                    </>\n                }'''
          new_left = '''                leftRail={\n                    <div className="grid gap-4 md:col-span-2 md:grid-cols-3 xl:col-span-3">\n                        <TodayStatsCard dict={dict} />\n                        <QuickStartCard dict={dict} />\n                        <FreeSupportCard dict={dict} />\n                        <div className="md:col-span-3">\n                            <ViewportSideRailAd slot="1341604736" showOn="desktop" height={250} />\n                        </div>\n                    </div>\n                }'''
          if old_left not in text:
              raise SystemExit('page.tsx: leftRail block not found')
          text = text.replace(old_left, new_left, 1)
          old_right = '''                rightRail={\n                    <>\n                        <PlatformGuideCard dict={dict} />\n                        <ViewportSideRailAd slot="6380909506" showOn="desktop" height={250} />\n                    </>\n                }'''
          new_right = '''                rightRail={\n                    <div className="space-y-4 md:col-span-2 xl:col-span-3">\n                        <PlatformGuideCard dict={dict} />\n                        <ViewportSideRailAd slot="6380909506" showOn="desktop" height={250} />\n                    </div>\n                }'''
          if old_right not in text:
              raise SystemExit('page.tsx: rightRail block not found')
          p.write_text(text.replace(old_right, new_right, 1), encoding='utf-8')

      - name: Verify no unintended overflow classes remain
        run: |
          grep -n "grid gap-5 p-4 sm:p-5" src/components/downloader/AdvancedDownloadOptions.tsx
          grep -n "使用说明" 'src/app/[locale]/unified-downloader.tsx'
          grep -n "xl:grid-cols-6" src/components/downloader/PlatformSupportGrid.tsx

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/downloader/AdvancedDownloadOptions.tsx \
                  src/components/downloader/VideoResultPanel.tsx \
                  src/components/downloader/PlatformSupportGrid.tsx \
                  src/components/downloader/PlatformGuideCard.tsx \
                  'src/app/[locale]/unified-downloader.tsx' \
                  'src/app/[locale]/page.tsx'
          git commit -m "fix: repair workbench layout and expand platform wall"
          git push origin HEAD:fix/workbench-layout-overlap-and-platform-wall
