name: Local Engine Platform Paths

on:
  pull_request:
    paths:
      - 'local-engine/platform_paths.py'
      - 'local-engine/runtime_paths_policy.py'
      - 'local-engine/runtime_storage.py'
      - 'local-engine/tool_manager.py'
      - 'local-engine/ffmpeg_manager.py'
      - 'local-engine/ffmpeg_online_installer.py'
      - 'local-engine/ffmpeg_update_status.py'
      - 'local-engine/managed_tool_metadata.py'
      - 'local-engine/tool_artifacts.py'
      - 'local-engine/tool_sources.py'
      - 'local-engine/tool_install_layout.py'
      - 'local-engine/desktop_tools.py'
      - 'scripts/test-local-platform-paths.py'
      - 'scripts/test-local-runtime-paths-policy.py'
      - 'scripts/test-local-runtime-storage.py'
      - 'scripts/test-local-tool-manager.py'
      - 'scripts/test-local-ffmpeg-manager.py'
      - 'scripts/test-local-managed-tool-metadata.py'
      - 'scripts/test-local-ffmpeg-online-installer.py'
      - 'scripts/test-local-ffmpeg-update-status.py'
      - 'scripts/test-local-tool-artifacts.py'
      - 'scripts/test-local-tool-sources.py'
      - 'scripts/test-local-tool-install-layout.py'
      - '.github/workflows/local-engine-platform-paths.yml'
  push:
    branches:
      - main
    paths:
      - 'local-engine/platform_paths.py'
      - 'local-engine/runtime_paths_policy.py'
      - 'local-engine/runtime_storage.py'
      - 'local-engine/tool_manager.py'
      - 'local-engine/ffmpeg_manager.py'
      - 'local-engine/ffmpeg_online_installer.py'
      - 'local-engine/ffmpeg_update_status.py'
      - 'local-engine/managed_tool_metadata.py'
      - 'local-engine/tool_artifacts.py'
      - 'local-engine/tool_sources.py'
      - 'local-engine/tool_install_layout.py'
      - 'local-engine/desktop_tools.py'
      - 'scripts/test-local-platform-paths.py'
      - 'scripts/test-local-runtime-paths-policy.py'
      - 'scripts/test-local-runtime-storage.py'
      - 'scripts/test-local-tool-manager.py'
      - 'scripts/test-local-ffmpeg-manager.py'
      - 'scripts/test-local-managed-tool-metadata.py'
      - 'scripts/test-local-ffmpeg-online-installer.py'
      - 'scripts/test-local-ffmpeg-update-status.py'
      - 'scripts/test-local-tool-artifacts.py'
      - 'scripts/test-local-tool-sources.py'
      - 'scripts/test-local-tool-install-layout.py'
      - '.github/workflows/local-engine-platform-paths.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-paths:
    name: Platform Paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile platform runtime path core
        run: >-
          python -m py_compile
          local-engine/platform_paths.py
          local-engine/runtime_paths_policy.py
          local-engine/runtime_storage.py
          local-engine/tool_manager.py
          local-engine/ffmpeg_manager.py
          local-engine/ffmpeg_online_installer.py
          local-engine/ffmpeg_update_status.py
          local-engine/managed_tool_metadata.py
          local-engine/tool_artifacts.py
          local-engine/tool_sources.py
          local-engine/tool_install_layout.py
          local-engine/desktop_tools.py
          scripts/test-local-platform-paths.py
          scripts/test-local-runtime-paths-policy.py
          scripts/test-local-runtime-storage.py
          scripts/test-local-tool-manager.py
          scripts/test-local-ffmpeg-manager.py
          scripts/test-local-managed-tool-metadata.py
          scripts/test-local-ffmpeg-online-installer.py
          scripts/test-local-ffmpeg-update-status.py
          scripts/test-local-tool-artifacts.py
          scripts/test-local-tool-sources.py
          scripts/test-local-tool-install-layout.py

      - name: Validate portable and installed layouts
        run: |
          python scripts/test-local-platform-paths.py
          python scripts/test-local-runtime-paths-policy.py
          python scripts/test-local-runtime-storage.py
          python scripts/test-local-tool-manager.py
          python scripts/test-local-ffmpeg-manager.py
          python scripts/test-local-managed-tool-metadata.py
          python scripts/test-local-ffmpeg-online-installer.py
          python scripts/test-local-ffmpeg-update-status.py
          python scripts/test-local-tool-artifacts.py
          python scripts/test-local-tool-sources.py
          python scripts/test-local-tool-install-layout.py
