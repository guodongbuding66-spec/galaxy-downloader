services:
  galaxy-headless:
    build:
      context: ./local-engine
      dockerfile: docker/Dockerfile
    image: galaxy-local-engine-headless:latest
    restart: unless-stopped
    environment:
      GALAXY_HEADLESS_TOKEN: ${GALAXY_HEADLESS_TOKEN:?Set GALAXY_HEADLESS_TOKEN to at least 24 characters}
      GALAXY_HEADLESS_HOST: 0.0.0.0
      GALAXY_HEADLESS_PORT: 17837
      GALAXY_PORTABLE: "0"
      GALAXY_HOME: /data
      GALAXY_DOWNLOAD_DIR: /data/downloads
    ports:
      - "${GALAXY_BIND_ADDRESS:-127.0.0.1}:17837:17837"
    volumes:
      - ${GALAXY_DATA_DIR:-./galaxy-data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
